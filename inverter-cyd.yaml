  # Forecast.Solar (free API, plain HTTPS GET). Day totals for today + tomorrow, then today's
  # power curve for "solar now". Panel plane comes from the Solar panels settings.
  - id: fetch_forecast
    mode: single
    then:
      # Skip (forecast stays unknown = treated as cloudy) unless there is room for TLS.
      - if:
          condition:
            lambda: |-
              size_t blk = heap_caps_get_largest_free_block(MALLOC_CAP_8BIT);
              size_t fre = heap_caps_get_free_size(MALLOC_CAP_8BIT);
              if (blk < 24000 || fre < 45000) {
                ESP_LOGW("fc", "skip forecast: free %u, block %u", (unsigned) fre, (unsigned) blk);
                return false;
              }
              return wifi::global_wifi_component->is_connected();
          else:
            - script.stop: fetch_forecast
      - http_request.get:
          url: !lambda 'return std::string("https://api.forecast.solar/estimate/watthours/day/${latitude}/${longitude}/") + str_sprintf("%.0f/%.0f/%.1f", id(n_pv_tilt).state, id(n_pv_az).state, id(n_pv_kwp).state);'
          capture_response: true
          max_response_buffer_size: 1024
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    ESP_LOGW("fc", "forecast.solar HTTP %d", response->status_code);
                    return;
                  }
                  auto t = id(sntp_time).now();
                  if (!t.is_valid()) return;
                  const std::string today = t.strftime("%Y-%m-%d");
                  const std::string tmrw = ESPTime::from_epoch_local(t.timestamp + 86400).strftime("%Y-%m-%d");
                  json::parse_json(body, [&](JsonObject root) -> bool {
                    JsonVariant v = root["result"][today];
                    if (v.isNull()) return false;
                    id(fc_today_kwh) = v.as<float>() / 1000.0f;
                    JsonVariant w = root["result"][tmrw];
                    if (!w.isNull()) id(fc_tomorrow_kwh) = w.as<float>() / 1000.0f;
                    id(fc_updated) = t.strftime("%H:%M");
                    return true;
                  });
          on_error:
            then:
              - logger.log: { level: WARN, format: "forecast.solar unreachable" }
      - delay: 2s
      - if:
          condition:
            lambda: |-
              size_t blk = heap_caps_get_largest_free_block(MALLOC_CAP_8BIT);
              size_t fre = heap_caps_get_free_size(MALLOC_CAP_8BIT);
              if (blk < 24000 || fre < 45000) {
                ESP_LOGW("fc", "skip forecast: free %u, block %u", (unsigned) fre, (unsigned) blk);
                return false;
              }
              return wifi::global_wifi_component->is_connected();
          else:
            - script.stop: fetch_forecast
      - http_request.get:
          url: !lambda 'return std::string("https://api.forecast.solar/estimate/watts/${latitude}/${longitude}/") + str_sprintf("%.0f/%.0f/%.1f", id(n_pv_tilt).state, id(n_pv_az).state, id(n_pv_kwp).state);'
          capture_response: true
          max_response_buffer_size: 3072
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) return;
                  auto t = id(sntp_time).now();
                  if (!t.is_valid()) return;
                  const std::string today = t.strftime("%Y-%m-%d");
                  json::parse_json(body, [&](JsonObject root) -> bool {
                    std::vector<std::pair<int, float>> c;
                    for (JsonPair kv : root["result"].as<JsonObject>()) {
                      const char *k = kv.key().c_str();          // "YYYY-MM-DD HH:MM:SS"
                      int hh, mm;
                      if (strncmp(k, today.c_str(), 10) == 0 && sscanf(k + 11, "%d:%d", &hh, &mm) == 2)
                        c.push_back({hh * 60 + mm, kv.value().as<float>()});
                    }
                    std::sort(c.begin(), c.end());
                    if (!c.empty()) id(fc_curve) = c;
                    return true;
                  });

  # Red banner on the screen (tap = silence + dismiss). Newest message replaces the old one.
  - id: notify
    mode: restart
    parameters:
      msg: string
    then:
      - lvgl.label.update:
          id: lbl_alert
          text: !lambda 'return msg;'
      - lvgl.widget.show: lbl_alert
      - script.execute: bl_wake
      - delay: 5min
      - lvgl.widget.hide: lbl_alert

  # Backlight on at the wanted level (100 %, or the auto-brightness level).
  - id: bl_wake
    then:
      - light.turn_on:
          id: backlight
          brightness: !lambda 'return id(bl_target).state;'
          transition_length: 0s

  # Short on-screen message, shown over any page (top layer).
  - id: toast
    mode: restart
    parameters:
      msg: string
    then:
      - lvgl.label.update:
          id: lbl_toast
          text: !lambda 'return msg;'
      - lvgl.widget.show: lbl_toast
      - delay: 3s
      - lvgl.widget.hide: lbl_toast

# -----------------------------------------------------------------------------
# UI (320x240 landscape). Page 1 = status, page 2 = settings. Swipe or tap tabs.
# -----------------------------------------------------------------------------
lvgl:
  displays: [tft]
  touchscreens: [touch]
  buffer_size: 25%               # no PSRAM on the CYD
  # Layout generated by ui.py and checked against the real Montserrat glyph widths
  # (no overlaps, nothing outside the screen or under the nav bar).
  theme:
    dark_mode: true
    label:
      text_color: 0x9AA8B5
    buttonmatrix:
      bg_opa: TRANSP
      border_width: 0
      pad_all: 2
      pad_column: 4
      text_font: montserrat_16
      items:
        bg_color: 0x26323F
        text_color: 0xECEFF1
        radius: 8
        pressed:
          bg_color: 0x1565C0
    button:
      radius: 10
      shadow_width: 0
      pressed:
        bg_color: 0x1565C0
    switch:
      bg_color: 0x37474F
      indicator:
        checked:
          bg_color: 0x43A047
    arc:
      arc_color: 0x26323F
      knob:
        bg_opa: TRANSP
        pad_all: 0
  style_definitions:
    - id: chip                   # highlighted value
      bg_color: 0x1C2833
      bg_opa: COVER
      border_color: 0x34506A
      border_width: 1
      radius: 6
      pad_left: 7
      pad_right: 7
      pad_top: 3
      pad_bottom: 3
      text_color: 0xFFCA28
  on_idle:
    - timeout: 90s
      then:
        - light.turn_on: { id: backlight, brightness: 15% }
    - timeout: 10min
      then:
        - light.turn_off: backlight
  # Shown over every page: nav bar, alarm banner, short messages, touch-debug dot.
  top_layer:
    widgets:
      - obj:
          x: 0
          y: 200
          width: 320
          height: 40
          bg_color: 0x0A0F14
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
      - buttonmatrix:
