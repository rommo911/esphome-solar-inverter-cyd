      - lambda: 'id(led_b).set_max_power(x / 100.0f);'

interval:
  # The controller (rules, planner, charger, alarms) is the solar_autopilot component below.

  # Status LED: green ok, blue = no WiFi, red blink = no inverter data, amber = on grid
  - interval: 500ms
    then:
      - lambda: |-
          if (id(led_test)) return;               // boot / button self-test owns the LED
          static bool blink = false; blink = !blink;
          const bool inv_ok = id(inv_link).state;
          const bool net_ok = wifi::global_wifi_component->is_connected();
          float rr = 0, gg = 0, bb = 0;
          if (!inv_ok)            { rr = blink ? 1 : 0; }
          else if (!net_ok)       { bb = 1; }
          else if (id(autopilot).status().reasons) { rr = 1; gg = 0.35; }
          else                    { gg = 1; }
          if (rr == 0 && gg == 0 && bb == 0) {
            // really off: an "on" light with RGB 0,0,0 is shown as white by ESPHome
            auto off = id(status_led).turn_off();
            off.set_transition_length(0);
            off.perform();
            return;
          }
          auto call = id(status_led).turn_on();
          call.set_rgb(rr, gg, bb);
          call.set_brightness(1.0);             // always full; balance colours with LED * Level
          call.set_transition_length(0);
          call.perform();

  # Screen refresh
  - interval: 2s
    then:
      # No fresh inverter data -> every inverter value shows N/A (not the last value).
      - lvgl.label.update:
          id: lbl_soc
          text: !lambda |-
            float v = id(s_soc).state;
            return (!id(inv_link).state || isnan(v)) ? std::string("N/A") : str_sprintf("%.0f%%", v);
      - lvgl.arc.update:
          id: arc_soc
          value: !lambda 'return (!id(inv_link).state || isnan(id(s_soc).state)) ? 0 : (int) id(s_soc).state;'
      - script.execute: ui_refresh_values
      # Status icons: green = OK, red = down
      - lvgl.label.update:
          id: ic_inv
          text_color: !lambda 'return lv_color_hex(id(inv_link).state ? 0x43A047 : 0xE53935);'
      - lvgl.label.update:
          id: ic_ha
          text_color: !lambda |-
            #ifdef USE_API
            return lv_color_hex(api::global_api_server->is_connected() ? 0x43A047 : 0xE53935);
            #else
            return lv_color_hex(0x4A5560);   // API not compiled in: grey
            #endif
      - lvgl.label.update:
          id: ic_wifi
          # red = no WiFi, yellow = WiFi but no internet contact for 11 min, green = internet OK
          text_color: !lambda |-
            if (!wifi::global_wifi_component->is_connected()) return lv_color_hex(0xE53935);
            const uint32_t fc = id(autopilot).forecast().last_reply_ms();   // a forecast reply counts too
            const bool inet = (id(net_ok_ms) != 0 && millis() - id(net_ok_ms) < 11UL * 60000UL) ||
                              (fc != 0 && millis() - fc < 11UL * 60000UL);
            return lv_color_hex(inet ? 0x43A047 : 0xFDD835);
      - lvgl.label.update:
          id: lbl_mode
          text: !lambda |-
            if (!id(inv_link).state) return std::string("No inverter data");
            static const char *names[] = {"USB", "SUB grid", "SBU battery"};
            const float v = id(s_output_source_priority).state;
            std::string m = isnan(v) ? "?" : names[(int) v % 3];
            const uint8_t r = id(autopilot).status().reasons;
            std::string why;
            if (r & 1) why += " LOW";
            if (r & 2) why += " HIGH";
            if (r & 4) why += " NIGHT";
            if (r & 8) why += " OVN";
            if (r & 16) why += " CHG";
            if (!id(auto_ctl).state) return m + " | MANUAL";
            if (id(sw_observe).state) return std::string("OBSERVE: ") + (id(autopilot).status().want_sub ? "SUB" : "SBU") + why;
            if (id(autopilot).status().fault) return m + " | FAULT";
            return m + why;
      - lvgl.label.update:
          id: lbl_status
          text: !lambda |-
            auto t = id(sntp_time).now();
            std::string s = t.is_valid() ? t.strftime("%H:%M") : std::string("--:--");
            s += str_sprintf("  %.0f/%.0f%%", id(autopilot).status().reserve_sw, id(autopilot).status().reserve_ret);
            s += isnan(id(autopilot).status().soc_at_sun) ? std::string("  sun --") : str_sprintf("  sun %.0f%%", id(autopilot).status().soc_at_sun);
            return s;
      - lvgl.label.update:
          id: lbl_ctl_state
          text: !lambda |-
            if (!id(inv_link).state) return std::string("No inverter data");
            static const char *out[] = {"USB", "SUB", "SBU"};
            const float o = id(s_output_source_priority).state;
            std::string s = std::string("Inverter ") + (isnan(o) ? "N/A" : out[(int) o % 3]);
            s += std::string(", plan ") + (id(autopilot).status().want_sub ? "SUB" : "SBU");
            return s + (id(autopilot).status().cloudy ? ", cloudy" : ", sunny");
      - lvgl.label.update:
          id: lbl_chg_state
          text: !lambda |-
            if (!id(sw_rule_charge).state) return std::string("Charger manager off");
            const float a = id(s_max_ac_charging_current).state;
            if (id(autopilot).status().charging) return str_sprintf("Grid charging, %.0f A", a);
            return std::string("Solar only") + (isnan(a) ? "" : str_sprintf(", %.0f A", a));
      - lvgl.label.update:
          id: lbl_ldr
          text: !lambda 'return isnan(id(s_ldr).state) ? std::string("--") : str_sprintf("%.3f V", id(s_ldr).state);'
      - lvgl.label.update:
          id: lbl_ldr_cal
          text: !lambda |-
            return str_sprintf("calibrated: dark %.3f V, bright %.3f V", id(n_ldr_dark).state, id(n_ldr_bright).state);
      # Auto brightness follows the room while the screen is in use (idle dimming still wins)
      - if:
          condition:
            and:
              - switch.is_on: sw_autobl
              - light.is_on: backlight
              - not:
                  lvgl.is_idle: { timeout: 90s }
          then:
            - lambda: |-
                float t = id(bl_target).state;
                if (fabsf(id(backlight).current_values.get_brightness() - t) > 0.04f) {
                  auto c = id(backlight).turn_on();
                  c.set_brightness(t);
                  c.set_transition_length(1000);
                  c.perform();
                }

# -----------------------------------------------------------------------------
# SCRIPTS
# -----------------------------------------------------------------------------
script:
  # LED self-test / calibration: 1 s red, 1 s green, 1 s blue, 2 s off, then normal status.
  # Runs at boot and from the "LED Test" button.
  - id: led_selftest
    mode: restart
    then:
      - lambda: 'id(led_test) = true;'
      - light.turn_on: { id: status_led, red: 100%, green: 0%, blue: 0%, brightness: 100%, transition_length: 0s }
      - delay: 1s
      - light.turn_on: { id: status_led, red: 0%, green: 100%, blue: 0%, brightness: 100%, transition_length: 0s }
      - delay: 1s
      - light.turn_on: { id: status_led, red: 0%, green: 0%, blue: 100%, brightness: 100%, transition_length: 0s }
      - delay: 1s
      - light.turn_off: { id: status_led, transition_length: 0s }
      - delay: 2s
      - lambda: 'id(led_test) = false;'

  # Advanced 8/8 'Restore defaults' (tap twice). Values = each entity's initial_value /
  # restore_mode default. Keeps touch orientation and light-sensor calibration.
  - id: restore_defaults
    then:
      - number.set: { id: n_cloudy_kwh, value: 5 }
      - number.set: { id: n_fc_interval_h, value: 2 }
      - number.set: { id: n_sunny_sw, value: 18 }
      - number.set: { id: n_sunny_ret, value: 25 }
      - number.set: { id: n_cloudy_sw, value: 25 }
      - number.set: { id: n_cloudy_ret, value: 30 }
      - number.set: { id: n_chg_target, value: 40 }
      - number.set: { id: n_chg_margin, value: 10 }
      - number.set: { id: n_emerg_soc, value: 15 }
      - number.set: { id: n_emerg_target, value: 25 }
      - number.set: { id: n_fast_below, value: 20 }
      - number.set: { id: n_chg_fast_a, value: 20 }
      - number.set: { id: n_chg_norm_a, value: 10 }
      - number.set: { id: n_ovn_floor, value: 10 }
      - number.set: { id: n_ovn_margin, value: 5 }
      - number.set: { id: n_base_floor, value: 300 }
      - number.set: { id: n_sun_delay_sunny, value: 1.5 }
      - number.set: { id: n_sun_delay_cloudy, value: 3 }
      - number.set: { id: n_low_delay, value: 60 }
      - number.set: { id: n_min_sub, value: 3 }
      - number.set: { id: n_float_v, value: 27 }
      - number.set: { id: n_high_on_w, value: 2500 }
      - number.set: { id: n_high_on_s, value: 6 }
      - number.set: { id: n_high_off_w, value: 2000 }
      - number.set: { id: n_high_off_s, value: 45 }
      - number.set: { id: n_high_max_soc, value: 80 }
      - number.set: { id: n_high_max_pv, value: 1200 }
      - number.set: { id: n_night_on_w, value: 1600 }
      - number.set: { id: n_night_on_s, value: 30 }
      - number.set: { id: n_night_max_soc, value: 70 }
      - number.set: { id: n_night_off_w, value: 600 }
      - number.set: { id: n_night_off_s, value: 60 }
      - number.set: { id: n_back_soc, value: 60 }
      - number.set: { id: n_back_w, value: 1000 }
      - number.set: { id: n_back_s, value: 10 }
      - number.set: { id: n_batt_kwh, value: 4.5 }
      - number.set: { id: n_empty_soc, value: 5 }
      - number.set: { id: n_pv_kwp, value: 2.0 }
      - number.set: { id: n_pv_tilt, value: 40 }
      - number.set: { id: n_pv_az, value: 0 }
      - number.set: { id: n_quiet_start, value: 1 }
      - number.set: { id: n_quiet_end, value: 9 }
      - number.set: { id: n_bl_min, value: 20 }
      - switch.turn_on: auto_ctl
      - switch.turn_on: sw_observe
      - switch.turn_on: sw_rule_low
      - switch.turn_on: sw_rule_high
      - switch.turn_on: sw_rule_night
      - switch.turn_on: sw_rule_ovn
      - switch.turn_on: sw_rule_charge
      - switch.turn_on: sw_rule_float
      - switch.turn_on: sw_buzzer
      - switch.turn_on: sw_quiet
      - switch.turn_off: sw_autobl
      - switch.turn_off: sw_touchdbg

  # Home / Power / Info value chips. Generated by ui.py. N/A when there is no fresh inverter data.
  - id: ui_refresh_values
    then:
      - lvgl.label.update:
          id: v_load
          text: !lambda |-
            float v = id(s_load_power).state;
            return (!id(inv_link).state || isnan(v)) ? std::string("N/A") : str_sprintf("%.0f W", v);
      - lvgl.label.update:
          id: v_pv
          text: !lambda |-
            float v = id(s_pv_power).state;
            return (!id(inv_link).state || isnan(v)) ? std::string("N/A") : str_sprintf("%.0f W", v);
      - lvgl.label.update:
          id: v_batt
          text: !lambda |-
            float v = id(s_soc).state;
            return (!id(inv_link).state || isnan(v)) ? std::string("N/A") : str_sprintf("%.0f %%", v);
      - lvgl.label.update:
          id: v_grid
          text: !lambda |-
            float v = id(grid_power).state;
            return (!id(inv_link).state || isnan(v)) ? std::string("N/A") : str_sprintf("%.0f W", v);
      - lvgl.label.update:
          id: p_pv
          text: !lambda |-
            float v = id(s_pv_power).state;
            return (!id(inv_link).state || isnan(v)) ? std::string("N/A") : str_sprintf("%.0f W", v);
      - lvgl.label.update:
          id: p_load
          text: !lambda |-
            float v = id(s_load_power).state;
            return (!id(inv_link).state || isnan(v)) ? std::string("N/A") : str_sprintf("%.0f W", v);
      - lvgl.label.update:
          id: p_batt
          text: !lambda |-
            float v = id(batt_power).state;
            return (!id(inv_link).state || isnan(v)) ? std::string("N/A") : str_sprintf("%+.0f W", v);
      - lvgl.label.update:
          id: p_grid
          text: !lambda |-
            float v = id(grid_power).state;
            return (!id(inv_link).state || isnan(v)) ? std::string("N/A") : str_sprintf("%.0f W", v);
      - lvgl.label.update:
          id: p_solar
          text: !lambda |-
            float v = id(e_solar_today).state;
            return (isnan(v)) ? std::string("N/A") : str_sprintf("%.2f kWh", v);
      - lvgl.label.update:
          id: p_bv
          text: !lambda |-
            float v = id(s_batt_v).state;
            return (!id(inv_link).state || isnan(v)) ? std::string("N/A") : str_sprintf("%.1f V", v);
      - lvgl.label.update:
          id: p_soc
          text: !lambda |-
            float v = id(s_soc).state;
            return (!id(inv_link).state || isnan(v)) ? std::string("N/A") : str_sprintf("%.0f %%", v);
      - lvgl.label.update:
          id: p_gv
          text: !lambda |-
            float v = id(s_grid_v).state;
            return (!id(inv_link).state || isnan(v)) ? std::string("N/A") : str_sprintf("%.0f V", v);
      - lvgl.label.update:
          id: p_temp
          text: !lambda |-
            float v = id(s_heatsink).state;
            return (!id(inv_link).state || isnan(v)) ? std::string("N/A") : str_sprintf("%.0f °C", v);
      - lvgl.label.update:
          id: i_rssi
          text: !lambda |-
            float v = id(s_rssi).state;
            return (isnan(v)) ? std::string("N/A") : str_sprintf("%.0f dBm", v);
      - lvgl.label.update:
          id: e_solar
          text: !lambda |-
            float v = id(e_solar_today).state;
            return (isnan(v)) ? std::string("N/A") : str_sprintf("%.2f kWh", v);
      - lvgl.label.update:
          id: e_load
          text: !lambda |-
            float v = id(e_load_today).state;
            return (isnan(v)) ? std::string("N/A") : str_sprintf("%.2f kWh", v);
      - lvgl.label.update:
          id: e_grid
          text: !lambda |-
            float v = id(e_grid_today).state;
            return (isnan(v)) ? std::string("N/A") : str_sprintf("%.2f kWh", v);
      - lvgl.label.update:
          id: e_chg
          text: !lambda |-
            float v = id(e_chg_today).state;
            return (isnan(v)) ? std::string("N/A") : str_sprintf("%.2f kWh", v);
      - lvgl.label.update:
          id: e_dis
          text: !lambda |-
            float v = id(e_dis_today).state;
            return (isnan(v)) ? std::string("N/A") : str_sprintf("%.2f kWh", v);
      - lvgl.arc.update:
          id: arc_pv
          value: !lambda 'float v = id(s_pv_power).state / std::max(0.1f, id(n_pv_kwp).state) / 10.0f; return (!id(inv_link).state || isnan(v)) ? 0 : (int) v;'
      - lvgl.arc.update:
          id: arc_load
          value: !lambda 'float v = id(s_load_power).state; return (!id(inv_link).state || isnan(v)) ? 0 : (int) v;'
      - lvgl.label.update:
          id: lbl_age
          text: !lambda |-
            if (id(autopilot).last_data_ms() == 0) return std::string("never");
            return str_sprintf("%us", (unsigned) ((millis() - id(autopilot).last_data_ms()) / 1000));
      - lvgl.label.update:
          id: x_left
          text: !lambda |-
            float soc = id(s_soc).state;
            if (!id(inv_link).state || isnan(soc)) return std::string("N/A");
            return str_sprintf("%.2f kWh", std::max(0.0f, id(n_batt_kwh).state * (soc - id(n_empty_soc).state) / 100.0f));
      - lvgl.label.update:
          id: x_rt_now
          text: !lambda |-
            float soc = id(s_soc).state, load = id(s_load_power).state;
            if (!id(inv_link).state || isnan(soc) || isnan(load)) return std::string("N/A");
            float wh = std::max(0.0f, id(n_batt_kwh).state * 10.0f * (soc - id(n_empty_soc).state));
            float h = wh / std::max(load, 50.0f);
            if (h >= 99.0f) return std::string("> 99 h");
            return str_sprintf("%dh %02dm", (int) h, (int) ((h - (int) h) * 60));
      - lvgl.label.update:
          id: x_rt_1h
          text: !lambda |-
            float soc = id(s_soc).state, load = id(s_load_1h).state;
            if (!id(inv_link).state || isnan(soc) || isnan(load)) return std::string("N/A");
            float wh = std::max(0.0f, id(n_batt_kwh).state * 10.0f * (soc - id(n_empty_soc).state));
            float h = wh / std::max(load, 50.0f);
            if (h >= 99.0f) return std::string("> 99 h");
            return str_sprintf("%dh %02dm", (int) h, (int) ((h - (int) h) * 60));
      - lvgl.label.update:
          id: x_fc_now
          text: !lambda |-
            auto t = id(sntp_time).now();
            const float v = t.is_valid() ? id(autopilot).forecast().power_at(t.hour * 60 + t.minute) : NAN;
            return isnan(v) ? std::string("N/A") : str_sprintf("%.0f W", v);
      - lvgl.label.update:
          id: x_fc_today
          text: !lambda |-
            float v = id(autopilot).forecast().today_kwh();
            return isnan(v) ? std::string("N/A") : str_sprintf("%.1f kWh", v);
      - lvgl.label.update:
          id: x_fc_tmrw
          text: !lambda |-
            float v = id(autopilot).forecast().tomorrow_kwh();
            return isnan(v) ? std::string("N/A") : str_sprintf("%.1f kWh", v);
      - lvgl.label.update:
          id: lbl_fc_upd
          text: !lambda |-
            return std::string(id(autopilot).forecast().status());
      - lvgl.label.update:
          id: i_fw
          text: !lambda |-
            return std::string("ESPHome " ESPHOME_VERSION);
      - lvgl.label.update:
          id: i_built
          text: !lambda |-
            return std::string(__DATE__ " " __TIME__);
      - lvgl.label.update:
          id: i_wifi
          text: !lambda |-
            return id(t_ssid).has_state() ? id(t_ssid).state : std::string("--");
      - lvgl.label.update:
          id: i_ip
          text: !lambda |-
            return id(t_ip).has_state() ? id(t_ip).state : std::string("--");
      - lvgl.label.update:
          id: i_up
          text: !lambda |-
            const unsigned s = millis() / 1000;
            return str_sprintf("%ud %02uh %02um", s / 86400, (s / 3600) % 24, (s / 60) % 60);
      - lvgl.label.update:
          id: i_mem
          text: !lambda |-
            return str_sprintf("free %u KB, block %u KB", (unsigned) (heap_caps_get_free_size(MALLOC_CAP_8BIT) / 1024),
                               (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_8BIT) / 1024));

  # Shared settings page (generated by cyd_ui.py). One screen page shows the 14 settings
  # pages in turn, so their widgets exist only once in RAM.
  #   what: 0 show current, 1 refresh values, 2 step row `slot` by `dir`, 3 page by `dir`,
  #         4 open virtual page `slot`
  - id: set_ui
    mode: queued
    max_runs: 6
    parameters:
      what: int
      slot: int
      dir: int
    then:
      - lambda: |-
          struct Row { number::Number *n; const char *name, *fmt; int16_t ny, cy, by, bh; const lv_font_t *nf, *cf; };
          struct Pg { const char *grp, *title; uint8_t nrows; Row r[4]; };
          static const Pg P[] = {
            {"SETUP 1/5", "Battery reserve", 4, {{id(n_sunny_sw), "Sunny: grid below", "%.0f %%", 43, 48, 44, 35, &lv_font_montserrat_16, &lv_font_montserrat_18}, {id(n_sunny_ret), "Sunny: battery above", "%.0f %%", 82, 87, 83, 35, &lv_font_montserrat_16, &lv_font_montserrat_18}, {id(n_cloudy_sw), "Cloudy: grid below", "%.0f %%", 121, 126, 122, 35, &lv_font_montserrat_16, &lv_font_montserrat_18}, {id(n_cloudy_ret), "Cloudy: battery above", "%.0f %%", 160, 165, 161, 35, &lv_font_montserrat_16, &lv_font_montserrat_18}}},
            {"SETUP 2/5", "Forecast & charging", 3, {{id(n_cloudy_kwh), "Cloudy if forecast below", "%.1f kWh", 47, 57, 44, 48, &lv_font_montserrat_18, &lv_font_montserrat_14}, {id(n_fc_interval_h), "Refresh forecast every", "%.0f h", 99, 109, 96, 48, &lv_font_montserrat_18, &lv_font_montserrat_14}, {id(n_chg_target), "Cloudy: grid-charge to", "%.0f %%", 151, 161, 148, 48, &lv_font_montserrat_18, &lv_font_montserrat_14}}},
            {"ADVANCED 1/13", "High load", 4, {{id(n_high_on_w), "Grid when load above", "%.0f W", 43, 49, 44, 35, &lv_font_montserrat_16, &lv_font_montserrat_16}, {id(n_high_on_s), "...for at least", "%.0f s", 91, 88, 83, 35, &lv_font_montserrat_16, &lv_font_montserrat_16}, {id(n_high_off_w), "Release when load below", "%.0f W", 121, 127, 122, 35, &lv_font_montserrat_16, &lv_font_montserrat_16}, {id(n_high_off_s), "...for at least", "%.0f s", 169, 166, 161, 35, &lv_font_montserrat_16, &lv_font_montserrat_16}}},
            {"ADVANCED 2/13", "High load limits", 2, {{id(n_high_max_soc), "Only if SOC below", "%.0f %%", 60, 69, 56, 50, &lv_font_montserrat_18, &lv_font_montserrat_16}, {id(n_high_max_pv), "Only if PV below", "%.0f W", 138, 147, 134, 50, &lv_font_montserrat_18, &lv_font_montserrat_16}}},
            {"ADVANCED 3/13", "Night load on", 3, {{id(n_night_on_w), "Grid when load above", "%.0f W", 47, 54, 44, 48, &lv_font_montserrat_18, &lv_font_montserrat_18}, {id(n_night_on_s), "...for at least", "%.0f s", 109, 106, 96, 48, &lv_font_montserrat_18, &lv_font_montserrat_18}, {id(n_night_max_soc), "Only if SOC below", "%.0f %%", 151, 158, 148, 48, &lv_font_montserrat_18, &lv_font_montserrat_18}}},
