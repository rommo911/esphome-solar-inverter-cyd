  - id: play_tune
    mode: queued
    max_runs: 4
    parameters:
      tune: string
      prio: int
      critical: bool
    then:
      - lambda: |-
          // @sim:play_tune
          if (!id(sw_buzzer).state) return;
          auto t = id(sntp_time).now();
          if (!critical && id(sw_quiet).state && !t.is_valid()) return;   // clock unknown: might be night
          if (!critical && id(sw_quiet).state && t.is_valid()) {
            const int s = (int) id(n_quiet_start).state, e = (int) id(n_quiet_end).state, h = t.hour;
            const bool quiet = s <= e ? (h >= s && h < e) : (h >= s || h < e);
            if (quiet) return;
          }
          if (id(buzzer).is_playing() && prio <= id(tune_prio)) return;
          const char *r = nullptr;
          if (tune == "grid_lost")          r = "gridlost:d=8,o=6,b=140:e,c,4a5";
          else if (tune == "grid_back")     r = "gridback:d=8,o=5,b=150:a,c6,4e6";
          else if (tune == "to_grid_low")   r = "togridlow:d=8,o=6,b=125:e,4c,p,e,4c";
          else if (tune == "to_grid")       r = "togrid:d=8,o=6,b=125:e,4c";
          else if (tune == "alarm_no_grid") r = "alarm:d=16,o=6,b=180:a,e,a,e,a,e,8p,a,e,a,e,a,e,8p,a,e,a,e,a,e";
          else if (tune == "warn_morning")  r = "morning:d=8,o=5,b=110:c6,p,g,p,e,p,4c,4p,c6,p,g,p,e,p,4c";
          else if (tune == "test")          r = "test:d=16,o=6,b=160:c,e,g,c7,8p,g,4c7";
          if (r == nullptr) { ESP_LOGW("buzzer", "unknown tune %s", tune.c_str()); return; }
          if (id(buzzer).is_playing()) id(buzzer).stop();
          id(tune_prio) = prio;
          id(buzzer).play(r);
