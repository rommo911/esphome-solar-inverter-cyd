# -----------------------------------------------------------------------------
# SENSORS (same as inverter-esphome.yaml + ids used by the control logic)
# -----------------------------------------------------------------------------
sensor:
  # Heap watch (no PSRAM): shows whether the HTTPS fetch has room.
  - platform: debug
    free:
      name: "Heap Free"
      internal: true
      entity_category: diagnostic
    block:
      name: "Heap Max Block"
      entity_category: diagnostic

  - platform: pipsolar
    pipsolar_id: my_inverter
    battery_bulk_voltage:
      name: "Battery Bulk Voltage"
      internal: true
      filters: [throttle: 10s]
    battery_float_voltage:
      id: s_battery_float_voltage
      name: "Battery Float Voltage"
      internal: true
      filters: [throttle: 10s]
    battery_recharge_voltage:
      id: s_battery_recharge_voltage
      name: "Battery Recharge Voltage"
      internal: true
      filters: [throttle: 10s]
    battery_redischarge_voltage:
      id: s_battery_redischarge_voltage
      name: "Battery Re-discharge Voltage"
      internal: true
      filters: [throttle: 10s]
    battery_under_voltage:
      id: s_battery_under_voltage
      name: "Battery Under Voltage"
      internal: true
      filters: [throttle: 10s]
    battery_type:
      name: "Battery Type (raw)"
      internal: true
      filters: [throttle: 60s]
    current_max_ac_charging_current:
      id: s_max_ac_charging_current
      name: "Max AC Charging Current"
      internal: true
      filters: [throttle: 3s]
    current_max_charging_current:
      name: "Max Charging Current"
      internal: true
      filters: [throttle: 3s]
    output_source_priority:
      id: s_output_source_priority
      name: "Output Source Priority (raw)"
      internal: true
      filters: [throttle: 2s]
    charger_source_priority:
      id: s_charger_source_priority
      name: "Charger Source Priority (raw)"
      internal: true
      filters: [throttle: 2s]

    grid_voltage:
      id: s_grid_v
      name: "Grid Voltage"
      filters: [throttle_average: 3s]
    ac_output_voltage:
      name: "AC Output Voltage"
      internal: true
      filters: [throttle_average: 3s]
    ac_output_apparent_power:
      name: "AC Output Apparent Power"
      internal: true
    ac_output_active_power:
      id: s_load_power
      name: "AC Output Active Power"
      filters: [delta: 2]
    output_load_percent:
      name: "Output Load Percent"
      internal: true
    bus_voltage:
      name: "Bus Voltage"
      internal: true
      filters: [throttle_average: 3s]
    battery_voltage:
      id: s_batt_v
      name: "Battery Voltage"
      filters:
        - throttle_average: 2s
        - delta: 0.5
      on_raw_value:   # every inverter reply, before filters (NaN = no/garbled reply)
        - lambda: 'if (!isnan(x)) id(last_inverter_data) = millis();'
    battery_charging_current:
      id: s_batt_chg_a
      name: "Battery Charging Current"
      internal: true
      filters: [throttle_average: 1s]
    battery_discharge_current:
      id: s_batt_dis_a
      name: "Battery Discharge Current"
      internal: true
      filters: [throttle_average: 1s]
    battery_capacity_percent:
      id: s_soc
      name: "Battery Capacity Percent"
      filters: [throttle_average: 5s]
    inverter_heat_sink_temperature:
      id: s_heatsink
      name: "Inverter Heat Sink Temperature"
      filters: [throttle_average: 5s]
    pv_input_voltage:
      name: "PV Input Voltage"
      internal: true
      filters: [throttle_average: 3s]
    pv_input_current_for_battery:
      name: "PV Input Current For Battery"
      internal: true
      filters: [throttle_average: 10s]
    pv_charging_power:
      id: s_pv_power
      name: "PV Charging Power"
      filters:
        - throttle_average: 5s
        - delta: 1

  - platform: template
    id: batt_charge_power
    name: "Battery Charge Power"
    internal: true
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (isnan(id(s_batt_v).state) || isnan(id(s_batt_chg_a).state)) return {};
      return id(s_batt_v).state * id(s_batt_chg_a).state;
  - platform: template
    id: batt_discharge_power
    name: "Battery Discharge Power"
    internal: true
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (isnan(id(s_batt_v).state) || isnan(id(s_batt_dis_a).state)) return {};
      return id(s_batt_v).state * id(s_batt_dis_a).state;
  - platform: template
    id: batt_power
    name: "Battery Power"
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (isnan(id(batt_discharge_power).state) || isnan(id(batt_charge_power).state)) return {};
      return id(batt_discharge_power).state - id(batt_charge_power).state;
  - platform: template
    id: grid_power
    name: "Grid Power (estimated)"
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (isnan(id(s_grid_v).state) || id(s_grid_v).state < 100) return 0.0f;
      float load = isnan(id(s_load_power).state) ? 0 : id(s_load_power).state;
      float pv   = isnan(id(s_pv_power).state)   ? 0 : id(s_pv_power).state;
      float chg  = isnan(id(batt_charge_power).state)    ? 0 : id(batt_charge_power).state;
      float dis  = isnan(id(batt_discharge_power).state) ? 0 : id(batt_discharge_power).state;
      float g = load + chg - pv - dis;
      return g > 110 ? g : 0.0f;

  - platform: integration
    name: "Solar Energy"
    sensor: s_pv_power
    time_unit: h
    restore: true
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters: [multiply: 0.001]
  - platform: integration
    name: "Battery Charge Energy"
    sensor: batt_charge_power
    time_unit: h
    restore: true
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters: [multiply: 0.001]
  - platform: integration
    name: "Battery Discharge Energy"
    sensor: batt_discharge_power
    time_unit: h
    restore: true
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters: [multiply: 0.001]
  - platform: integration
    name: "Grid Import Energy"
    sensor: grid_power
    time_unit: h
    restore: true
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters: [multiply: 0.001]
  - platform: integration
    name: "Load Energy"
    sensor: s_load_power
    time_unit: h
    restore: true
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters: [multiply: 0.001]
  # ---- controller plan (exposed to Home Assistant)
  - platform: template
    name: "Reserve Switch SOC"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(reserve_sw);'
  - platform: template
    name: "Reserve Return SOC"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(reserve_ret);'
  - platform: template
    name: "Solar Forecast Used"
    unit_of_measurement: kWh
    accuracy_decimals: 1
    update_interval: 60s
    lambda: 'return id(plan_fc);'
  - platform: template
    name: "Solar Forecast Today"
    unit_of_measurement: kWh
    accuracy_decimals: 1
    update_interval: 60s
    lambda: 'return id(fc_today_kwh);'
  - platform: template
    name: "Solar Forecast Tomorrow"
    unit_of_measurement: kWh
    accuracy_decimals: 1
    update_interval: 60s
    lambda: 'return id(fc_tomorrow_kwh);'
  - platform: template
    name: "Predicted SOC At Sun"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(soc_at_sun);'
  - platform: template
    name: "Base Load"
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(base_load);'
  - platform: template
    name: "Battery Remaining"
    unit_of_measurement: kWh
    accuracy_decimals: 2
    update_interval: 30s
    lambda: |-
      const float soc = id(s_soc).state;
      if (!id(inv_link).state || isnan(soc)) return {};
      return std::max(0.0f, id(n_batt_kwh).state * (soc - id(n_empty_soc).state) / 100.0f);
  - platform: template
    name: "Battery Runtime"
    unit_of_measurement: h
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      const float soc = id(s_soc).state;
      if (!id(inv_link).state || isnan(soc)) return {};
      return std::max(0.0f, id(n_batt_kwh).state * 10.0f * (soc - id(n_empty_soc).state)) / id(base_load);
  - platform: total_daily_energy
    id: e_load_today
    name: "Load Energy Today"
    internal: true
    power_id: s_load_power
    time_id: sntp_time
    restore: true
    unit_of_measurement: kWh
    accuracy_decimals: 2
    filters: [multiply: 0.001]
  - platform: total_daily_energy
    id: e_grid_today
    name: "Grid Import Energy Today"
    internal: true
    power_id: grid_power
    time_id: sntp_time
    restore: true
    unit_of_measurement: kWh
    accuracy_decimals: 2
    filters: [multiply: 0.001]
  - platform: total_daily_energy
    id: e_chg_today
    name: "Battery Charge Energy Today"
    internal: true
    power_id: batt_charge_power
    time_id: sntp_time
    restore: true
    unit_of_measurement: kWh
    accuracy_decimals: 2
    filters: [multiply: 0.001]
  - platform: total_daily_energy
    id: e_dis_today
    name: "Battery Discharge Energy Today"
    internal: true
    power_id: batt_discharge_power
    time_id: sntp_time
    restore: true
    unit_of_measurement: kWh
    accuracy_decimals: 2
    filters: [multiply: 0.001]
  # rolling 1 h average of the load (sample every 15 s, 240 samples), for the runtime estimate
  - platform: template
    id: s_load_1h
    name: "Load 1h Average"
    internal: true
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      if (!id(inv_link).state || isnan(id(s_load_power).state)) return {};
      return id(s_load_power).state;
    filters:
      - sliding_window_moving_average: { window_size: 240, send_every: 4, send_first_at: 1 }
  - platform: total_daily_energy
    id: e_solar_today
    name: "Solar Energy Today"
    internal: true
    power_id: s_pv_power
    time_id: sntp_time
    restore: true
    unit_of_measurement: kWh
    accuracy_decimals: 2
    filters: [multiply: 0.001]

  # On-board light sensor (LDR on GPIO34, ADC1). Raw volts: higher = darker.
  # Only measured for now; auto-dim the backlight once real readings are known.
  - platform: adc
    id: s_ldr
    name: "Ambient Light (raw)"
    internal: true
    pin: GPIO34
    attenuation: 0db
    update_interval: 1s
    entity_category: diagnostic
    accuracy_decimals: 3
    filters:
      - median: { window_size: 5, send_every: 2 }

  # Backlight level wanted right now (0-1). Auto off -> 100 %.
  # Linear between the two calibration readings, so it works whichever way the LDR goes.
  - platform: template
    id: bl_target
    internal: true
    update_interval: 2s
    lambda: |-
      if (!id(sw_autobl).state) return 1.0f;
      float v = id(s_ldr).state, d = id(n_ldr_dark).state, b = id(n_ldr_bright).state;
      if (isnan(v) || fabsf(d - b) < 0.005f) return 1.0f;
      float dark = clamp((v - b) / (d - b), 0.0f, 1.0f);    // 0 = bright room, 1 = dark room
      float lo = id(n_bl_min).state / 100.0f;
      return 1.0f - dark * (1.0f - lo);

  - platform: wifi_signal
    id: s_rssi
    name: "ESP WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "ESP Uptime"
    update_interval: 60s
  - platform: template
    name: "Inverter Data Age"
    internal: true
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: 'return (millis() - id(last_inverter_data)) / 1000.0;'


binary_sensor:
  - platform: template
    name: "Cloudy Day Plan"
    lambda: 'return id(cloudy);'
  - platform: template
    name: "Grid Charging Active"
    lambda: 'return id(charging);'
  - platform: template
    name: "Controller Fault"
    device_class: problem
    lambda: 'return id(ctl_fault);'
  # BOOT button (GPIO0, only a strapping pin at reset): each press = next touch orientation
  - platform: gpio
    id: btn_boot
    internal: true
    pin: { number: GPIO0, inverted: true, mode: { input: true, pullup: true }, ignore_strapping_warning: true }
    filters: [delayed_on: 30ms]
    on_press:
      - lambda: |-
          uint8_t o = (id(touch_orient) + 1) & 7;
          id(touch_orient) = o;
          id(touch).set_swap_xy(o & 4);
          id(touch).set_mirror_x(o & 2);
          id(touch).set_mirror_y(o & 1);
          ESP_LOGW("touch", "orientation %u: swap=%d mx=%d my=%d", o, !!(o & 4), !!(o & 2), !!(o & 1));
      - script.execute:
          id: toast
          msg: !lambda |-
            uint8_t o = id(touch_orient);
            return str_sprintf("Touch %u/8: swap %s, mirror X %s, Y %s", o + 1,
                               (o & 4) ? "on" : "off", (o & 2) ? "on" : "off", (o & 1) ? "on" : "off");
      - script.execute: bl_wake

  # Fresh inverter data (< 30 s). Pipsolar sensors keep their last value when the
  # link drops, so the screen and the inverter controls go by this, not by NaN.
  - platform: template
    id: inv_link
    name: "Inverter Link"
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(last_inverter_data) != 0 && millis() - id(last_inverter_data) < 30000 &&
             !isnan(id(s_soc).state) && !isnan(id(s_load_power).state);

  - platform: pipsolar
    pipsolar_id: my_inverter
    load_status:
      name: "Load On"
      internal: true
    charging_status:
      name: "Charging"
      internal: true
    scc_charging_status:
      name: "Solar Charging"
      internal: true
    ac_charging_status:
      name: "AC Charging"
      internal: true
    charging_to_floating_mode:
      id: bs_floating
      name: "Floating Mode"
      internal: true
      # "Adjust Float mode": entering float -> configured float voltage
      on_press:
        - if:
            condition:
              lambda: |-
                return id(sw_rule_float).state &&
                       fabsf(id(s_battery_float_voltage).state - id(n_float_v).state) > 0.05f;
            then:
              - select.set:
                  id: sel_battery_float_voltage
                  option: !lambda 'return str_sprintf("%.1f", id(n_float_v).state);'
    warnings_present:
      name: "Warnings Present"
    faults_present:
      name: "Faults Present"
    warning_line_fail:
      name: "Warning Grid Lost"
      internal: true
    warning_battery_low_alarm:
      name: "Warning Battery Low"
      internal: true
    warning_battery_under_shutdown:
      name: "Warning Battery Under Shutdown"
      internal: true
    warning_over_load:
      name: "Warning Overload"
      internal: true
    warning_over_temperature:
      name: "Warning Over Temperature"
      internal: true
    warning_fan_lock:
      name: "Warning Fan Lock"
      internal: true
  - platform: template
    id: bs_grid
    name: "Grid Available"
    device_class: power
    lambda: 'return !isnan(id(s_grid_v).state) && id(s_grid_v).state > 150;'
    filters:
      - delayed_on: 30s
      - delayed_off: 30s
    on_press:
      - if:
          condition:
            lambda: 'return id(boot_ms) != 0 && millis() - id(boot_ms) > 90000;'
          then:
            - script.execute: { id: play_tune, tune: "grid_back", prio: 1, critical: false }
    on_release:
      - if:
          condition:
            lambda: 'return id(boot_ms) != 0 && millis() - id(boot_ms) > 90000;'
          then:
            - lambda: |-
                // @sim:grid_lost
                const float soc = id(s_soc).state;
                const bool low = !isnan(soc) && soc < ${alarm_soc};
                id(low_alarmed) = low;
                id(play_tune).execute(std::string(low ? "alarm_no_grid" : "grid_lost"), low ? 3 : 2, low);
  - platform: status
    name: "ESP Status"

text_sensor:
  - platform: template
    name: "Controller State"
    update_interval: 10s
    lambda: |-
      if (!id(inv_link).state) return std::string("no inverter data");
      const uint8_t r = id(sub_reasons);
      std::string why;
      if (r & 1) why += " LOW";
      if (r & 2) why += " HIGH";
      if (r & 4) why += " NIGHT";
      if (r & 8) why += " OVERNIGHT";
      if (r & 16) why += " CHARGE";
      std::string s = std::string(id(want_sub) ? "grid (SUB)" : "battery (SBU)") + why;
      if (!id(auto_ctl).state) s = "manual";
      else if (id(sw_observe).state) s = "observe only: would " + s;
      if (id(ctl_fault)) s += ", FAULT";
      return s;
  - platform: pipsolar
    pipsolar_id: my_inverter
    device_mode:
      name: "Device Mode"
      filters:
        - map:
            - P -> Power On
            - S -> Standby
            - L -> Line (Grid)
            - B -> Battery
            - F -> Fault
            - H -> Power Saving
            - D -> Shutdown
    last_qpiws:
      name: "Warning Bits (QPIWS)"
  - platform: version
    name: "ESPHome Version"
  - platform: wifi_info
    ssid:
      id: t_ssid
      name: "ESP WiFi SSID"
    ip_address:
      id: t_ip
      name: "ESP IP Address"

button:
  - platform: template
    name: "LED Test"
    icon: mdi:led-on
    entity_category: config
    on_press:
      - script.execute: led_selftest
  - platform: template
    name: "Buzzer Test"
    entity_category: config
    on_press:
      - script.execute: { id: play_tune, tune: "test", prio: 1, critical: true }
  - platform: restart
    name: "ESP Restart"
  - platform: safe_mode
    name: "ESP Safe Mode Boot"

# -----------------------------------------------------------------------------
# SELECTS (unchanged from inverter-esphome.yaml)
# -----------------------------------------------------------------------------
select:
  - platform: template
    name: "Output Source Priority"
    id: sel_output_source_priority
    update_interval: 3s
    options:
      - "Utility first (USB)"
      - "Solar first (SUB)"
      - "Battery first (SBU)"
    lambda: |-
      float v = id(s_output_source_priority).state;
      if (isnan(v)) return {};
      switch ((int) v) {
        case 0: return std::string("Utility first (USB)");
        case 1: return std::string("Solar first (SUB)");
        case 2: return std::string("Battery first (SBU)");
      }
      return {};
    set_action:
      - output.pipsolar.set_level:
          id: out_output_source_priority
          value: !lambda |-
            if (x == "Utility first (USB)") return 0.0f;
            if (x == "Solar first (SUB)") return 1.0f;
            return 2.0f;

  - platform: template
    name: "Charger Source Priority"
    internal: true
    id: sel_charger_source_priority
    update_interval: 3s
    options:
      - "Utility first"
      - "Solar first"
      - "Solar and utility"
      - "Solar only"
    lambda: |-
      float v = id(s_charger_source_priority).state;
      if (isnan(v)) return {};
      switch ((int) v) {
        case 0: return std::string("Utility first");
        case 1: return std::string("Solar first");
        case 2: return std::string("Solar and utility");
        case 3: return std::string("Solar only");
      }
      return {};
    set_action:
      - output.pipsolar.set_level:
          id: out_charger_source_priority
          value: !lambda |-
            if (x == "Utility first") return 0.0f;
            if (x == "Solar first") return 1.0f;
            if (x == "Solar and utility") return 2.0f;
            return 3.0f;

