# =============================================================================
# DRAFT - Standalone inverter controller on a Cheap Yellow Display (ESP32-2432S028R)
# Axpert VMIII-4000 (24V) via RS232 (MAX3232) -> CYD CN1 connector (GPIO22/GPIO27)
#
# Board (confirmed 2026-11-01): ESP32-2432S028R, 2.8" ILI9341 320x240, XPT2046 touch,
# no PSRAM. Pins used: TFT 14/13/12/15/2, backlight 21, touch 25/32/39/33/36,
# RGB LED 4/16/17, speaker P4 = GPIO26 (on-board amp), LDR = GPIO34,
# inverter UART on CN1 = GPIO22 (TX) / GPIO27 (RX).
# Free/avoid: SD card 5/18/19/23 (unused), BOOT button GPIO0, P3 = 35/22/21
# (22 is our UART TX, 21 is the backlight - do not use P3).
#
# Replaces inverter-esphome.yaml AND the 8 Home Assistant automations.
# HA stays optional: the native API is still exposed for history/dashboards,
# but nothing here needs HA to be running.
#
# See ../ESPHOME_STANDALONE_CASE_STUDY.md for the rule-by-rule mapping.
# =============================================================================

substitutions:
  name: inverter-cyd            # change to inverter_esphome when it replaces the old board
  friendly_name: inverter-cyd
  timezone: Asia/Damascus       # UTC+3 all year; HA is set to Africa/Cairo, old ESP to Europe/Sofia
  latitude: "36.15"
  longitude: "36.73"
  # Forecast.Solar plane: now the "PV Array Size / Tilt / Azimuth" settings (Advanced > Solar panels)
  # buzzer alarm levels (no grid)
  alarm_soc: "30"
  repeat_soc: "20"
  # All rule thresholds are "number" entities (config category), editable on the
  # screen (Setup tabs) and from HA. Defaults = the values the HA automations used.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: 800              # before WiFi and the screen: memory baseline for the log
      then:
        - lambda: |-
            ESP_LOGW("mem", "boot: free %u B, largest block %u B",
                     (unsigned) heap_caps_get_free_size(MALLOC_CAP_8BIT),
                     (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_8BIT));
    - priority: -100
      then:
      - lambda: 'id(boot_ms) = std::max<uint32_t>(millis(), 1);'   # never 0, never in the future
      - script.execute: ui_sync_all
      - lambda: |-
          uint8_t o = id(touch_orient);
          id(touch).set_swap_xy(o & 4);
          id(touch).set_mirror_x(o & 2);
          id(touch).set_mirror_y(o & 1);
      - lambda: |-
          id(led_r).set_max_power(id(n_led_r).state / 100.0f);
          id(led_g).set_max_power(id(n_led_g).state / 100.0f);
          id(led_b).set_max_power(id(n_led_b).state / 100.0f);
      - script.execute: led_selftest
      - lambda: |-
          ESP_LOGW("mem", "after screen + WiFi: free %u B, largest block %u B, lowest so far %u B",
                   (unsigned) heap_caps_get_free_size(MALLOC_CAP_8BIT),
                   (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_8BIT),
                   (unsigned) heap_caps_get_minimum_free_size(MALLOC_CAP_8BIT));

esp32:
  board: esp32dev
  variant: esp32
  cpu_frequency: 240MHZ
  flash_size: 4MB
  flash_mode: qio              # quad SPI flash (was DIO), supported by the WROOM-32 module
  flash_frequency: 80MHZ       # was 40 MHz
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"   # this board's chip is v3.1: uses its ROM code, smaller binary
      flash_chip: generic            # only the generic flash driver (saves IRAM)
    sdkconfig_options:
      # RAM for HTTPS (no PSRAM): fewer permanently allocated WiFi buffers (defaults 10/32/32/32)
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "6"
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "16"
      CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM: "16"
      CONFIG_ESP_WIFI_MGMT_SBUF_NUM: "12"
      # HTTPS (Forecast.Solar) on a no-PSRAM board: TLS buffers are allocated only
      # during the fetch and freed after it, instead of ~40 KB held permanently.
      CONFIG_MBEDTLS_DYNAMIC_BUFFER: y
      CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA: y
      CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT: y
      # We only send small requests; incoming stays 16 KB (servers may send full records).
      CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN: y
      CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN: "4096"
      # Common CA subset (has ISRG Root X1, used by api.forecast.solar). Saves flash.
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_CMN: y

# Settings are saved to flash at most every 15 s (default 1 min), so a change
# made just before a power cut is not lost.
preferences:
  flash_write_interval: 15s

logger:
  level: WARN

# Home Assistant API: off by default (standalone). To connect HA, uncomment both lines.
# Note: the ESPHome dashboard's "Logs" over WiFi also needs the API; without it, read logs over
# USB at web.esphome.io. reboot_timeout 0s = never reboot because HA is missing.
# api:
#   reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: NONE
  min_auth_mode: WPA2
  reboot_timeout: 0s
  # DHCP: works on any network. The fixed address below is for the house network (192.168.10.x)
  # only - on another network it joins WiFi but cannot reach the internet (no time, no forecast).
  # manual_ip:
  #   static_ip: 192.168.10.4
  #   gateway: 192.168.10.1
  #   subnet: 255.255.255.0
  #   dns1: 8.8.8.8
  #   dns2: 8.8.4.4

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    servers:                     # three independent providers (ESPHome takes up to 3)
      - 0.pool.ntp.org
      - time.google.com
      - time.cloudflare.com
    update_interval: 5min        # each sync also proves the internet works (WiFi icon)
    on_time_sync:
      - lambda: 'id(net_ok_ms) = std::max<uint32_t>(millis(), 1);'
  # Extra time source when HA is connected - needs the api: block above.
  # - platform: homeassistant
  #   id: ha_time

sun:
  id: sun_c
  latitude: ${latitude}°
  longitude: ${longitude}°

# -----------------------------------------------------------------------------
# CONTROLLER (components/solar_autopilot): output priority rules, reserve planner, charger
# manager, alarms. Plain C++ core (also usable from Arduino / ESP-IDF); this block connects it.
# -----------------------------------------------------------------------------
external_components:
  - source:
      type: local
      path: components
    components: [solar_autopilot]

solar_autopilot:
  id: autopilot
  time_id: sntp_time
  sun_id: sun_c
  alarm_soc: ${alarm_soc}%           # no grid: alarm below, then every 10 min below repeat
  alarm_repeat_soc: ${repeat_soc}%
  # readings
  soc: s_soc
  load_power: s_load_power
  pv_power: s_pv_power
  grid: bs_grid                       # debounced 30 s (delayed_on / delayed_off)
  floating: bs_floating
  solar_today: e_solar_today
  output_priority_state: s_output_source_priority
  charger_source_state: s_charger_source_priority
  charge_current_state: s_max_ac_charging_current
  float_voltage_state: s_battery_float_voltage
  # Forecast.Solar, fetched by the component: day totals (+ today's power curve) every
  # "Forecast Refresh" hours, every minute after a failure (15 min after HTTP 429). The panel plane
  # is the "PV Array Size / Tilt / Azimuth" settings.
  forecast:
    latitude: ${latitude}
    longitude: ${longitude}
  # what it writes (the only writer of these)
  output_priority: sel_output_source_priority
  charger_source: sel_charger_source_priority
  charge_current: sel_max_ac_charging_current
  float_voltage: sel_battery_float_voltage
  # settings: key -> number / switch entity (generated by tools/gen_autopilot_settings.py)
  settings:
    cloudy_kwh: n_cloudy_kwh
    fc_interval_h: n_fc_interval_h
    sunny_sw: n_sunny_sw
    sunny_ret: n_sunny_ret
    cloudy_sw: n_cloudy_sw
    cloudy_ret: n_cloudy_ret
    chg_target: n_chg_target
    chg_margin: n_chg_margin
    emerg_soc: n_emerg_soc
    emerg_target: n_emerg_target
    fast_below: n_fast_below
    chg_fast_a: n_chg_fast_a
    chg_norm_a: n_chg_norm_a
    ovn_floor: n_ovn_floor
    ovn_margin: n_ovn_margin
    base_floor: n_base_floor
    sun_delay_sunny: n_sun_delay_sunny
    sun_delay_cloudy: n_sun_delay_cloudy
    low_delay: n_low_delay
    min_sub: n_min_sub
    float_v: n_float_v
    high_on_w: n_high_on_w
    high_on_s: n_high_on_s
    high_off_w: n_high_off_w
    high_off_s: n_high_off_s
    high_max_soc: n_high_max_soc
    high_max_pv: n_high_max_pv
    night_on_w: n_night_on_w
    night_on_s: n_night_on_s
    night_max_soc: n_night_max_soc
    night_off_w: n_night_off_w
    night_off_s: n_night_off_s
    back_soc: n_back_soc
    back_w: n_back_w
    back_s: n_back_s
    batt_kwh: n_batt_kwh
    empty_soc: n_empty_soc
    pv_kwp: n_pv_kwp
    pv_tilt: n_pv_tilt
    pv_az: n_pv_az
    quiet_start: n_quiet_start
    quiet_end: n_quiet_end
    auto_ctl: auto_ctl
    observe: sw_observe
    rule_low: sw_rule_low
    rule_high: sw_rule_high
    rule_night: sw_rule_night
    rule_ovn: sw_rule_ovn
    rule_charge: sw_rule_charge
    rule_float: sw_rule_float
    buzzer: sw_buzzer
    quiet: sw_quiet
  on_tune:
    - script.execute: { id: play_tune, tune: !lambda 'return tune;', prio: !lambda 'return prio;', critical: !lambda 'return critical;' }
  on_notify:
    - script.execute: { id: notify, msg: !lambda 'return message;' }

debug:
  update_interval: 30s

http_request:
  timeout: 10s
  verify_ssl: true
  watchdog_timeout: 20s          # the request blocks the loop; TLS handshake takes a few s

# -----------------------------------------------------------------------------
# CYD HARDWARE
# -----------------------------------------------------------------------------
spi:
  - id: spi_tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: spi_touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

uart:
  id: uart_inverter
  tx_pin: GPIO22                 # CN1 pin 2
  rx_pin: GPIO27                 # CN1 pin 3
  baud_rate: 2400
  data_bits: 8
  parity: NONE
  stop_bits: 1

pipsolar:
  id: my_inverter
  uart_id: uart_inverter

display:
  # ESPHome preset for the 2-USB (USB-C + micro) CYD: ILI9342, natively 320x240 landscape.
  # (240x320 + swap_xy on the ILI9341 driver gave a clean but portrait image = native landscape.)
  - platform: mipi_spi
    id: tft
    model: ESP32-2432S028-9342
    spi_id: spi_tft
    # red showed as yellow with invert on + BGR, so both are flipped
    invert_colors: false
    color_order: rgb
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: xpt2046
    id: touch
    spi_id: spi_touch
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    threshold: 400
    calibration:                 # calibrate per board
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: true
    on_touch:
      - script.execute: bl_wake
      - if:
          condition: { switch.is_on: sw_touchdbg }
          then:
            - lvgl.widget.update:
                id: touch_dot
                hidden: false
                x: !lambda 'return touch.x - 5;'
                y: !lambda 'return touch.y - 5;'
            - lambda: 'ESP_LOGW("touch", "x=%d y=%d raw=%d,%d", touch.x, touch.y, touch.x_raw, touch.y_raw);'

output:
  # CYD speaker connector P4 (GPIO26 -> on-board amplifier). PWM buzzer module or 8 ohm speaker.
  - platform: ledc
    id: spk_out
    pin: GPIO26
  - platform: ledc
    id: bl_out
    pin: GPIO21
  # RGB LED on the back of the board: common anode -> a pin LOW lights its colour (inverted)
  - platform: ledc
    id: led_r
    pin: { number: GPIO4, inverted: true }
    max_power: 100%              # runtime-scaled by the LED * Level settings
  - platform: ledc
    id: led_g
    pin: { number: GPIO16, inverted: true }
    max_power: 100%              # runtime-scaled by the LED * Level settings
  - platform: ledc
    id: led_b
    pin: { number: GPIO17, inverted: true }
    max_power: 100%              # runtime-scaled by the LED * Level settings

  # ---- Inverter writable settings (unchanged from inverter-esphome.yaml) ----
  - platform: pipsolar
    pipsolar_id: my_inverter
    output_source_priority:
      id: out_output_source_priority
      possible_values: [0, 1, 2]
    charger_source_priority:
      id: out_charger_source_priority
      possible_values: [0, 1, 2, 3]
    current_max_ac_charging_current:
      id: out_max_ac_charging_current
      possible_values: [2, 10, 20, 30, 40, 50, 60]
    battery_recharge_voltage:
      id: out_battery_recharge_voltage
      possible_values: [22.0, 22.5, 23.0, 23.5, 24.0, 24.5, 25.0, 25.5]
    battery_redischarge_voltage:
      id: out_battery_redischarge_voltage
      possible_values: [24.0, 24.5, 25.0, 25.5, 26.0, 26.5, 27.0, 27.5, 28.0, 28.5, 29.0]
    battery_under_voltage:
      id: out_battery_under_voltage
      possible_values: [21.0, 21.1, 21.2, 21.3, 21.4, 21.5, 21.6, 21.7, 21.8, 21.9, 22.0, 22.1, 22.2, 22.3, 22.4, 22.5, 22.6, 22.7, 22.8, 22.9, 23.0, 23.1, 23.2, 23.3, 23.4, 23.5, 23.6, 23.7, 23.8, 23.9, 24.0]
    battery_float_voltage:
      id: out_battery_float_voltage
      possible_values: [24.0, 24.1, 24.2, 24.3, 24.4, 24.5, 24.6, 24.7, 24.8, 24.9, 25.0, 25.1, 25.2, 25.3, 25.4, 25.5, 25.6, 25.7, 25.8, 25.9, 26.0, 26.1, 26.2, 26.3, 26.4, 26.5, 26.6, 26.7, 26.8, 26.9, 27.0, 27.1, 27.2, 27.3, 27.4, 27.5, 27.6, 27.7, 27.8, 27.9, 28.0, 28.1, 28.2, 28.3, 28.4, 28.5, 28.6, 28.7, 28.8, 28.9, 29.0, 29.1, 29.2]

rtttl:
  id: buzzer
  output: spk_out
  gain: 60%
  on_finished_playback:
    - lambda: 'id(tune_prio) = 0;'

light:
  - platform: monochromatic
    id: backlight
    name: "Display Backlight"
    internal: true
    output: bl_out
    restore_mode: ALWAYS_ON
    gamma_correct: 1.0           # default 2.8 made "15 %" ~0.5 % = looked off
    default_transition_length: 250ms
  - platform: rgb
    id: status_led
    name: "Status LED"
    internal: true
    red: led_r
    green: led_g
    blue: led_b
    restore_mode: ALWAYS_OFF
    gamma_correct: 1.0           # default 2.8 made the LED very dim and mixed colours wrong

# -----------------------------------------------------------------------------
# STATE
# -----------------------------------------------------------------------------
globals:
  - id: tune_prio
    type: uint8_t
    initial_value: '0'
  - id: boot_ms
    type: uint32_t
    initial_value: '0'
  - id: net_ok_ms               # millis() of the last internet contact (NTP sync, forecast reply); 0 = none
    type: uint32_t
    initial_value: '0'
  # Touch orientation, bit 2 = swap_xy, bit 1 = mirror_x, bit 0 = mirror_y.
  # BOOT button cycles it (saved), so it can be fixed without reflashing.
  - id: touch_orient
    type: uint8_t
    restore_value: true
    initial_value: '7'
  # LED self-test running (status LED logic paused)
  - id: led_test
    type: bool
    initial_value: 'true'
  # Shared settings page: which settings page it shows, and where set_ui navigates to
  - id: set_idx
    type: int
    initial_value: '0'
  - id: set_goto                # 0 stay, 1 show page_set, -1..-4 a real page (rules/sound/display/reset)
    type: int
    initial_value: '0'
  # Restore-defaults confirmation: time of the first tap (0 = not armed)
  - id: reset_armed
    type: uint32_t
    initial_value: '0'

# -----------------------------------------------------------------------------
# USER SETTINGS (replace HA input_number helpers; editable on screen and in HA)
# -----------------------------------------------------------------------------
switch:
  # Generated from tools/cyd_settings.py.
  - platform: template
    id: auto_ctl
    name: "Auto Control"
    icon: mdi:robot
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - if:
          condition:
            lambda: 'return id(boot_ms) != 0;'
          then:
            - lvgl.widget.update: { id: lv_auto_ctl, state: { checked: true } }
    on_turn_off:
      - if:
          condition:
            lambda: 'return id(boot_ms) != 0;'
          then:
            - lvgl.widget.update: { id: lv_auto_ctl, state: { checked: false } }
