interval:
  # No grid + low battery: alarm once below ${alarm_soc} %, then every 10 min below ${repeat_soc} %
  - interval: 60s
    then:
      - lambda: |-
          // @sim:alarm_soc
          static uint32_t last = 0;
          const float soc = id(s_soc).state;
          const bool fresh = millis() - id(last_inverter_data) < 120000;
          if (!id(bs_grid).has_state() || id(bs_grid).state || isnan(soc) || !fresh || soc >= ${alarm_soc}) {
            if (soc >= ${alarm_soc} + 5 || (id(bs_grid).has_state() && id(bs_grid).state)) id(low_alarmed) = false;
            return;
          }
          const uint32_t now = millis();
          if (!id(low_alarmed) || (soc < ${repeat_soc} && now - last >= 600000)) {
            id(low_alarmed) = true;
            last = now;
            id(play_tune).execute(std::string("alarm_no_grid"), 3, true);
          }
  # ---------------------------------------------------------------------------
  # Controller v2 (handoff section 4). One writer per inverter setting: output priority and
  # charger source / current are written only here. Rules only set reasons (latched).
  # Reasons: LOW=1 HIGH=2 NIGHT=4 OVERNIGHT=8 CHARGE=16. Any reason -> SUB (grid), none -> SBU.
  # ---------------------------------------------------------------------------
  - interval: 2s
    then:
      - lambda: |-
          // @sim:controller
          const uint32_t now = millis();
          if (now - id(boot_ms) < 30000) return;                 // let the inverter readings settle
          if (!id(inv_link).state) return;                       // stale data: write nothing, keep latches
          const float soc = id(s_soc).state, load = id(s_load_power).state, pv = id(s_pv_power).state;
          id(load_acc) += load; id(load_cnt)++;                  // for the 1-minute load means
          const bool grid = id(bs_grid).has_state() && id(bs_grid).state;
          const auto t = id(sntp_time).now();
          const bool time_ok = t.is_valid();                     // no clock -> time-based rules pause
          const bool night = time_ok && id(sun_c).elevation() < -0.833;
          const float sw = id(reserve_sw), ret = id(reserve_ret);
          auto ms = [](float s) -> uint32_t { return (uint32_t) (s * 1000.0f); };
          auto held = [&](uint32_t &since, bool cond, uint32_t dur) -> bool {   // cond true for dur ms
            if (!cond) { since = 0; return false; }
            if (since == 0) since = std::max<uint32_t>(now, 1);
            return now - since >= dur;
          };
          static uint32_t t_low, t_ret, t_hi, t_hi_rel, t_ng, t_ng_rel, t_ng_rel2, t_ov, t_ov_rel, t_chg;
          const uint8_t LOW = 1, HIGH = 2, NIGHT = 4, OVN = 8, CHG = 16;
          uint8_t r = id(sub_reasons);

          // ---- predicted SOC when the sun becomes useful (handoff 4D)
          const float base = id(base_load);
          const float delay_h = id(cloudy) ? id(n_sun_delay_cloudy).state : id(n_sun_delay_sunny).state;
          const bool rise_known = time_ok && id(sunrise_ts) != 0 && t.timestamp >= id(sunrise_ts) &&
                                  t.timestamp - id(sunrise_ts) < 2 * 86400;
          float hrs = NAN;
          bool sun_useful = false;
          if (time_ok && !night) {
            const float since_h = rise_known ? (t.timestamp - id(sunrise_ts)) / 3600.0f : 99.0f;
            sun_useful = (!isnan(pv) && pv >= base) || since_h > delay_h;
            hrs = sun_useful ? 0.0f : std::max(delay_h - since_h, 0.0f);
          } else if (night && rise_known) {
            uint32_t next = id(sunrise_ts);
            while (next <= (uint32_t) t.timestamp) next += 86400;   // same time tomorrow (+-2 min)
            hrs = (next - t.timestamp) / 3600.0f + delay_h;
          }
          const float soc_sun = isnan(hrs) ? NAN : soc - base * hrs / (id(n_batt_kwh).state * 10.0f);
          id(soc_at_sun) = soc_sun;

          // ---- LOW: below the planner's switch SOC -> grid; above its return SOC -> release
          {
            const uint32_t d = ms(id(n_low_delay).state);
            const bool on = held(t_low, soc < sw, d), off = held(t_ret, soc > ret, d);
            if (!id(sw_rule_low).state) r &= ~LOW;
            else if (on) r |= LOW;
            else if (off) r &= ~LOW;
          }
          // ---- HIGH: heavy load while SOC and PV are low
          {
            const bool on = held(t_hi, load > id(n_high_on_w).state && soc < id(n_high_max_soc).state &&
                                       (isnan(pv) || pv < id(n_high_max_pv).state), ms(id(n_high_on_s).state));
            const bool off = held(t_hi_rel, load < id(n_high_off_w).state, ms(id(n_high_off_s).state));
            if (!id(sw_rule_high).state) r &= ~HIGH;
            else if (on) r |= HIGH;
            else if (off) r &= ~HIGH;
          }
          // ---- NIGHT: medium load at night with SOC below the night limit
          {
            const bool on = held(t_ng, night && load > id(n_night_on_w).state &&
                                       soc < id(n_night_max_soc).state, ms(id(n_night_on_s).state));
            const bool off1 = held(t_ng_rel, load < id(n_night_off_w).state && soc > ret, ms(id(n_night_off_s).state));
            const bool off2 = held(t_ng_rel2, soc > id(n_back_soc).state && load < id(n_back_w).state,
                                   ms(id(n_back_s).state));
            if (!id(sw_rule_night).state || !time_ok) r &= ~NIGHT;
            else if (on) r |= NIGHT;
            else if (off1 || off2) r &= ~NIGHT;
          }
          // ---- OVERNIGHT: the battery would be too low when the sun becomes useful
          {
            const float target = std::max(id(n_ovn_floor).state, sw);
            const bool on = held(t_ov, night && !isnan(soc_sun) && soc_sun < target, 5 * 60000);
            const bool off = held(t_ov_rel, !isnan(soc_sun) && soc_sun > target + id(n_ovn_margin).state, 5 * 60000);
            if (!id(sw_rule_ovn).state || !time_ok || isnan(soc_sun)) r &= ~OVN;
            else if (on) r |= OVN;
            else if (off || sun_useful) r &= ~OVN;
          }
          // ---- CHARGE: charger manager latch (handoff 4B)
          const float emerg_t = id(n_emerg_target).state;
          const float chg_t = id(cloudy) ? std::max(id(n_chg_target).state, emerg_t) : emerg_t;
          {
            const bool start = held(t_chg, grid && ((id(cloudy) && soc < id(n_chg_target).state - id(n_chg_margin).state) ||
                                                    soc < id(n_emerg_soc).state), ms(id(n_low_delay).state));
            const bool stop = !grid || soc >= chg_t;
            if (!id(sw_rule_charge).state) id(charging) = false;
            else id(charging) = start || (id(charging) && !stop);
            if (id(charging) && grid && soc < chg_t) r |= CHG; else r &= ~CHG;
          }
          id(sub_reasons) = r;

          // ---- output priority (handoff 4C): SUB at once, back to SBU only after the minimum time on
          // SUB. State-based: write while the read-back differs, at most every 30 s; a write that
          // has not taken after one retry raises the fault alarm (then retries every 5 min).
          const bool want = r != 0;
          id(want_sub) = want;
          const float rb = id(s_output_source_priority).state;     // 0 USB, 1 SUB, 2 SBU
          const bool is_sub = rb == 1.0f, is_sbu = rb == 2.0f;
          if (!is_sub) id(sub_since) = 0;
          else if (id(sub_since) == 0) id(sub_since) = std::max<uint32_t>(now, 1);
          const bool min_ok = !is_sub || now - id(sub_since) >= (uint32_t) (id(n_min_sub).state * 60000.0f);
          const bool active = id(auto_ctl).state && !id(sw_observe).state;
          static uint32_t last_out = 0, last_chg_w = 0;
          static uint8_t out_tries = 0, chg_tries = 0;
          const bool out_bad = want ? !is_sub : !is_sbu;
          if (!active || !out_bad) out_tries = 0;
          else if (want || min_ok) {
            const uint32_t gap = out_tries >= 2 ? 300000 : 30000;
            if (last_out == 0 || now - last_out >= gap) {
              if (out_tries == 2 && !id(ctl_fault)) {
                id(ctl_fault) = true;
                id(notify).execute(std::string("Inverter did not accept the output priority"));
                id(play_tune).execute(std::string("alarm_no_grid"), 3, true);
              }
              if (want && is_sbu && grid && out_tries == 0 && (r & ~CHG))   // routine charging: no tune
                id(play_tune).execute(std::string((r & LOW) ? "to_grid_low" : "to_grid"), (r & LOW) ? 2 : 1, false);
              if (want && (r & LOW) && out_tries == 0) id(notify).execute(std::string("Battery low - switched to grid"));
              id(sel_output_source_priority).make_call().set_option(want ? "Solar first (SUB)" : "Battery first (SBU)").perform();
              ESP_LOGW("ctl", "priority -> %s (reasons=0x%02X soc=%.0f load=%.0f reserve %.0f/%.0f try %u)",
                       want ? "SUB" : "SBU", r, soc, load, sw, ret, out_tries + 1);
              last_out = now;
              if (out_tries < 2) out_tries++;
            }
          }

          // ---- charger source + AC charge current (only writer): solar only, unless charging
          bool chg_bad = false;
          if (id(sw_rule_charge).state) {
            const float src_v = id(charging) ? 2.0f : 3.0f;      // 2 = solar and utility, 3 = solar only
            const float want_a = (id(charging) && soc < id(n_fast_below).state) ? id(n_chg_fast_a).state
                                                                                : id(n_chg_norm_a).state;
            static const int opts[] = {2, 10, 20, 30, 40, 50, 60};
            int best = 0;
            for (int i = 1; i < 7; i++)
              if (fabsf(opts[i] - want_a) < fabsf(opts[best] - want_a)) best = i;
            const bool src_bad = id(s_charger_source_priority).state != src_v;
            const bool cur_bad = (int) id(s_max_ac_charging_current).state != opts[best];
            chg_bad = src_bad || cur_bad;
            if (!active || !chg_bad) chg_tries = 0;
            else if (last_chg_w == 0 || now - last_chg_w >= (chg_tries >= 2 ? 300000u : 30000u)) {
              if (chg_tries == 2 && !id(ctl_fault)) {
                id(ctl_fault) = true;
                id(notify).execute(std::string("Inverter did not accept the charger setting"));
              }
              if (src_bad) id(sel_charger_source_priority).make_call().set_option(id(charging) ? "Solar and utility" : "Solar only").perform();
              else id(sel_max_ac_charging_current).make_call().set_option(to_string(opts[best])).perform();
              ESP_LOGW("ctl", "charger -> %s %d A (soc=%.0f)", id(charging) ? "solar+utility" : "solar only", opts[best], soc);
              last_chg_w = now;
              if (chg_tries < 2) chg_tries++;
            }
          }
          if (id(ctl_fault) && !out_bad && !chg_bad) id(ctl_fault) = false;

  # Planner + load statistics, every minute (handoff 4A, section 5)
  - interval: 60s
    then:
      - lambda: |-
          // @sim:planner
          // 3 h median of one-minute load means (no data = no sample)
          if (id(load_cnt) > 0) {
            id(load_ring)[id(load_pos)] = (uint16_t) std::min(65535.0f, std::max(0.0f, id(load_acc) / id(load_cnt)));
            id(load_pos) = (id(load_pos) + 1) % 180;
            if (id(load_n) < 180) id(load_n)++;
            id(load_acc) = 0; id(load_cnt) = 0;
          }
          const auto &ring = id(load_ring);
          if (id(load_n) >= 30) {
            std::vector<uint16_t> v(ring.begin(), ring.begin() + id(load_n));
            std::nth_element(v.begin(), v.begin() + v.size() / 2, v.end());
            id(load_median) = v[v.size() / 2];
          }
          if (id(load_n) >= 5) {
            float sum = 0;
            for (int i = 1; i <= 5; i++) sum += ring[(id(load_pos) + 180 - i) % 180];
            id(load_mean5) = sum / 5;
          }
          id(base_load) = std::max(isnan(id(load_median)) ? 0.0f : id(load_median), id(n_base_floor).state);

          // sunrise = sun crossing -0.833 deg upward (for the "since sunrise" rules)
          const auto t = id(sntp_time).now();
          static float prev_el = NAN;
          if (t.is_valid()) {
            const float el = id(sun_c).elevation();
            if (!isnan(prev_el) && prev_el < -0.833f && el >= -0.833f) id(sunrise_ts) = t.timestamp;
            prev_el = el;
          }

          // reserve planner: forecast for the coming day; afternoon -> tomorrow
          float fc = (t.is_valid() && t.hour >= 12) ? id(fc_tomorrow_kwh) : id(fc_today_kwh);
          if (isnan(fc))   // no internet: persistence (today so far after 15:00, else yesterday)
            fc = (t.is_valid() && t.hour >= 15) ? id(e_solar_today).state : id(sol_yday_kwh);
          const bool cl = isnan(fc) || fc < id(n_cloudy_kwh).state;   // unknown counts as cloudy
          id(plan_fc) = fc;
          id(cloudy) = cl;
          const float sw = std::clamp(cl ? id(n_cloudy_sw).state : id(n_sunny_sw).state, 16.0f, 37.0f);
          const float ret = std::min(std::max({cl ? id(n_cloudy_ret).state : id(n_sunny_ret).state, sw + 3.0f, 25.0f}), 40.0f);
          id(reserve_sw) = sw;
          id(reserve_ret) = ret;

  # Battery runtime / morning alarms without grid (handoff 4E, 4G), at most every 30 min each
  - interval: 60s
    then:
      - lambda: |-
          // @sim:alarms
          const uint32_t now = millis();
          static uint32_t t_rb, t_rn, t_mw, last_rt, last_mw;
          auto held = [&](uint32_t &since, bool cond, uint32_t dur) -> bool {
            if (!cond) { since = 0; return false; }
            if (since == 0) since = std::max<uint32_t>(now, 1);
            return now - since >= dur;
          };
          const bool no_grid = id(bs_grid).has_state() && !id(bs_grid).state;
          if (!id(inv_link).state || !no_grid) { t_rb = t_rn = t_mw = 0; return; }
          const float soc = id(s_soc).state;
          const float usable = std::max(0.0f, id(n_batt_kwh).state * 10.0f * (soc - id(n_empty_soc).state));
          const float rt_base = usable / id(base_load);
          const float rt_now = isnan(id(load_mean5)) ? NAN : usable / std::max(id(load_mean5), 50.0f);
          const bool b = held(t_rb, rt_base < 2.0f, 120000);
          const bool n = held(t_rn, !isnan(rt_now) && rt_now < 0.5f, 300000);
          if ((b || n) && (last_rt == 0 || now - last_rt >= 1800000)) {
            last_rt = now;
            id(notify).execute(str_sprintf("No grid: battery for about %.1f h", std::min(rt_base, isnan(rt_now) ? rt_base : rt_now)));
            id(play_tune).execute(std::string("alarm_no_grid"), 3, true);
          }
          if (held(t_mw, !isnan(id(soc_at_sun)) && id(soc_at_sun) < id(n_ovn_floor).state, 300000) &&
              (last_mw == 0 || now - last_mw >= 1800000)) {
            last_mw = now;
            id(notify).execute(str_sprintf("No grid: battery may run out before sunrise (%.0f %%)", id(soc_at_sun)));
            id(play_tune).execute(std::string("warn_morning"), 3, true);
          }

  # Forecast refresh: every 2 h, or every 15 min until the first good fetch.
  - interval: 60s
    then:
      - if:
          condition:
            lambda: |-
              if (millis() < 60000 || id(fetch_forecast).is_running()) return false;
              if (!wifi::global_wifi_component->is_connected() || !id(sntp_time).now().is_valid()) return false;
              uint32_t wait = id(fc_updated).empty() ? 15UL * 60000UL : 2UL * 3600000UL;
              return id(fc_last_try) == 0 || millis() - id(fc_last_try) >= wait;
          then:
            - lambda: 'id(fc_last_try) = millis();'
            - script.execute: fetch_forecast

  # Status LED: green ok, blue = no WiFi, red blink = no inverter data, amber = on grid
  - interval: 500ms
    then:
      - lambda: |-
          if (id(led_test)) return;               // boot / button self-test owns the LED
          static bool blink = false; blink = !blink;
          const bool inv_ok = id(inv_link).state;
          const bool net_ok = wifi::global_wifi_component->is_connected();
          float rr = 0, gg = 0, bb = 0;
          if (!inv_ok)            { rr = blink ? 1 : 0; }
          else if (!net_ok)       { bb = 1; }
          else if (id(sub_reasons)) { rr = 1; gg = 0.35; }
          else                    { gg = 1; }
          if (rr == 0 && gg == 0 && bb == 0) {
            // really off: an "on" light with RGB 0,0,0 is shown as white by ESPHome
            auto off = id(status_led).turn_off();
            off.set_transition_length(0);
            off.perform();
            return;
          }
          auto call = id(status_led).turn_on();
          call.set_rgb(rr, gg, bb);
          call.set_brightness(1.0);             // always full; balance colours with LED * Level
          call.set_transition_length(0);
          call.perform();

  # Screen refresh
  - interval: 2s
    then:
      # No fresh inverter data -> every inverter value shows N/A (not the last value).
      - lvgl.label.update:
          id: lbl_soc
          text: !lambda |-
            float v = id(s_soc).state;
            return (!id(inv_link).state || isnan(v)) ? std::string("N/A") : str_sprintf("%.0f%%", v);
      - lvgl.arc.update:
          id: arc_soc
          value: !lambda 'return (!id(inv_link).state || isnan(id(s_soc).state)) ? 0 : (int) id(s_soc).state;'
      - script.execute: ui_refresh_values
      # Status icons: green = OK, red = down
      - lvgl.label.update:
          id: ic_inv
          text_color: !lambda 'return lv_color_hex(id(inv_link).state ? 0x43A047 : 0xE53935);'
      - lvgl.label.update:
          id: ic_ha
          text_color: !lambda 'return lv_color_hex(api::global_api_server->is_connected() ? 0x43A047 : 0xE53935);'
      - lvgl.label.update:
          id: ic_wifi
          text_color: !lambda 'return lv_color_hex(wifi::global_wifi_component->is_connected() ? 0x43A047 : 0xE53935);'
      - lvgl.label.update:
          id: lbl_mode
          text: !lambda |-
            if (!id(inv_link).state) return std::string("No inverter data");
            static const char *names[] = {"USB", "SUB grid", "SBU battery"};
            const float v = id(s_output_source_priority).state;
            std::string m = isnan(v) ? "?" : names[(int) v % 3];
            const uint8_t r = id(sub_reasons);
            std::string why;
            if (r & 1) why += " LOW";
            if (r & 2) why += " HIGH";
            if (r & 4) why += " NIGHT";
            if (r & 8) why += " OVN";
            if (r & 16) why += " CHG";
            if (!id(auto_ctl).state) return m + " | MANUAL";
            if (id(sw_observe).state) return std::string("OBSERVE: ") + (id(want_sub) ? "SUB" : "SBU") + why;
            if (id(ctl_fault)) return m + " | FAULT";
            return m + why;
      - lvgl.label.update:
          id: lbl_status
          text: !lambda |-
            auto t = id(sntp_time).now();
            std::string s = t.is_valid() ? t.strftime("%H:%M") : std::string("--:--");
            s += str_sprintf("  %.0f/%.0f%%", id(reserve_sw), id(reserve_ret));
            s += isnan(id(soc_at_sun)) ? std::string("  sun --") : str_sprintf("  sun %.0f%%", id(soc_at_sun));
            return s;
      - lvgl.label.update:
          id: lbl_ctl_state
          text: !lambda |-
            if (!id(inv_link).state) return std::string("No inverter data");
            static const char *out[] = {"USB", "SUB", "SBU"};
            const float o = id(s_output_source_priority).state;
            std::string s = std::string("Inverter ") + (isnan(o) ? "N/A" : out[(int) o % 3]);
            s += std::string(", plan ") + (id(want_sub) ? "SUB" : "SBU");
            return s + (id(cloudy) ? ", cloudy" : ", sunny");
      - lvgl.label.update:
          id: lbl_chg_state
          text: !lambda |-
            if (!id(sw_rule_charge).state) return std::string("Charger manager off");
            const float a = id(s_max_ac_charging_current).state;
            if (id(charging)) return str_sprintf("Grid charging, %.0f A", a);
            return std::string("Solar only") + (isnan(a) ? "" : str_sprintf(", %.0f A", a));
      - lvgl.label.update:
          id: lbl_ldr
          text: !lambda 'return isnan(id(s_ldr).state) ? std::string("--") : str_sprintf("%.3f V", id(s_ldr).state);'
      - lvgl.label.update:
          id: lbl_ldr_cal
          text: !lambda |-
            return str_sprintf("calibrated: dark %.3f V, bright %.3f V", id(n_ldr_dark).state, id(n_ldr_bright).state);
      # Auto brightness follows the room while the screen is in use (idle dimming still wins)
      - if:
          condition:
            and:
              - switch.is_on: sw_autobl
              - light.is_on: backlight
              - not:
                  lvgl.is_idle: { timeout: 90s }
          then:
            - lambda: |-
                float t = id(bl_target).state;
                if (fabsf(id(backlight).current_values.get_brightness() - t) > 0.04f) {
                  auto c = id(backlight).turn_on();
                  c.set_brightness(t);
                  c.set_transition_length(1000);
                  c.perform();
                }

# -----------------------------------------------------------------------------
# SCRIPTS
# -----------------------------------------------------------------------------
script:
  # LED self-test / calibration: 1 s red, 1 s green, 1 s blue, 2 s off, then normal status.
  # Runs at boot and from the "LED Test" button.
  - id: led_selftest
    mode: restart
    then:
      - lambda: 'id(led_test) = true;'
      - light.turn_on: { id: status_led, red: 100%, green: 0%, blue: 0%, brightness: 100%, transition_length: 0s }
      - delay: 1s
      - light.turn_on: { id: status_led, red: 0%, green: 100%, blue: 0%, brightness: 100%, transition_length: 0s }
      - delay: 1s
      - light.turn_on: { id: status_led, red: 0%, green: 0%, blue: 100%, brightness: 100%, transition_length: 0s }
      - delay: 1s
      - light.turn_off: { id: status_led, transition_length: 0s }
      - delay: 2s
      - lambda: 'id(led_test) = false;'

  # Advanced 8/8 'Restore defaults' (tap twice). Values = each entity's initial_value /
  # restore_mode default. Keeps touch orientation and light-sensor calibration.
  - id: restore_defaults
    then:
      - number.set: { id: n_cloudy_kwh, value: 5 }
      - number.set: { id: n_sunny_sw, value: 18 }
      - number.set: { id: n_sunny_ret, value: 25 }
      - number.set: { id: n_cloudy_sw, value: 25 }
      - number.set: { id: n_cloudy_ret, value: 30 }
      - number.set: { id: n_chg_target, value: 40 }
      - number.set: { id: n_chg_margin, value: 10 }
      - number.set: { id: n_emerg_soc, value: 15 }
      - number.set: { id: n_emerg_target, value: 25 }
      - number.set: { id: n_fast_below, value: 20 }
      - number.set: { id: n_chg_fast_a, value: 20 }
      - number.set: { id: n_chg_norm_a, value: 10 }
      - number.set: { id: n_ovn_floor, value: 10 }
      - number.set: { id: n_ovn_margin, value: 5 }
      - number.set: { id: n_base_floor, value: 300 }
      - number.set: { id: n_sun_delay_sunny, value: 1.5 }
      - number.set: { id: n_sun_delay_cloudy, value: 3 }
      - number.set: { id: n_low_delay, value: 60 }
      - number.set: { id: n_min_sub, value: 3 }
      - number.set: { id: n_float_v, value: 27 }
      - number.set: { id: n_high_on_w, value: 2500 }
      - number.set: { id: n_high_on_s, value: 6 }
      - number.set: { id: n_high_off_w, value: 2000 }
      - number.set: { id: n_high_off_s, value: 45 }
      - number.set: { id: n_high_max_soc, value: 80 }
      - number.set: { id: n_high_max_pv, value: 1200 }
      - number.set: { id: n_night_on_w, value: 1600 }
