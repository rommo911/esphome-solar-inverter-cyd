number:
  # Generated from tools/cyd_settings.py. All settings are exposed to Home Assistant.
  - platform: template
    id: n_cloudy_kwh
    name: "Cloudy Below"
    entity_category: config
    unit_of_measurement: "kWh"
    mode: box
    min_value: 0
    max_value: 20
    step: 0.5
    initial_value: 5
    optimistic: true
    restore_value: true
    on_value:
      - if:
          condition:
            lambda: 'return id(boot_ms) != 0;'
          then:
            - lvgl.label.update: { id: lb_n_cloudy_kwh, text: !lambda 'return str_sprintf("%.1f kWh", x);' }
  - platform: template
    id: n_sunny_sw
    name: "Sunny Day Switch SOC"
    entity_category: config
    unit_of_measurement: "%"
    mode: box
    min_value: 16
    max_value: 37
    step: 1
    initial_value: 18
    optimistic: true
    restore_value: true
    on_value:
      - if:
          condition:
            lambda: 'return id(boot_ms) != 0;'
          then:
            - lvgl.label.update: { id: lb_n_sunny_sw, text: !lambda 'return str_sprintf("%.0f %%", x);' }
  - platform: template
    id: n_sunny_ret
    name: "Sunny Day Return SOC"
    entity_category: config
    unit_of_measurement: "%"
    mode: box
    min_value: 25
    max_value: 40
    step: 1
    initial_value: 25
    optimistic: true
    restore_value: true
    on_value:
      - if:
          condition:
            lambda: 'return id(boot_ms) != 0;'
          then:
            - lvgl.label.update: { id: lb_n_sunny_ret, text: !lambda 'return str_sprintf("%.0f %%", x);' }
  - platform: template
    id: n_cloudy_sw
    name: "Cloudy Day Switch SOC"
    entity_category: config
