# -----------------------------------------------------------------------------
# SENSORS (same as inverter-esphome.yaml + ids used by the control logic)
# -----------------------------------------------------------------------------
sensor:
  # Heap watch (no PSRAM): shows whether the HTTPS fetch has room.
  - platform: debug
    free:
      name: "Heap Free"
      internal: true
      entity_category: diagnostic
    block:
      name: "Heap Max Block"
      entity_category: diagnostic

  - platform: pipsolar
    pipsolar_id: my_inverter
    battery_bulk_voltage:
      name: "Battery Bulk Voltage"
      internal: true
      filters: [throttle: 10s]
    battery_float_voltage:
      id: s_battery_float_voltage
      name: "Battery Float Voltage"
      internal: true
      filters: [throttle: 10s]
    battery_recharge_voltage:
      id: s_battery_recharge_voltage
      name: "Battery Recharge Voltage"
      internal: true
      filters: [throttle: 10s]
    battery_redischarge_voltage:
      id: s_battery_redischarge_voltage
      name: "Battery Re-discharge Voltage"
      internal: true
      filters: [throttle: 10s]
    battery_under_voltage:
      id: s_battery_under_voltage
      name: "Battery Under Voltage"
      internal: true
      filters: [throttle: 10s]
    battery_type:
      name: "Battery Type (raw)"
      internal: true
      filters: [throttle: 60s]
    current_max_ac_charging_current:
      id: s_max_ac_charging_current
      name: "Max AC Charging Current"
      internal: true
      filters: [throttle: 3s]
    current_max_charging_current:
      name: "Max Charging Current"
      internal: true
      filters: [throttle: 3s]
    output_source_priority:
      id: s_output_source_priority
      name: "Output Source Priority (raw)"
      internal: true
      filters: [throttle: 2s]
    charger_source_priority:
      id: s_charger_source_priority
      name: "Charger Source Priority (raw)"
      internal: true
      filters: [throttle: 2s]

    grid_voltage:
      id: s_grid_v
      name: "Grid Voltage"
      filters: [throttle_average: 3s]
    ac_output_voltage:
      name: "AC Output Voltage"
      internal: true
      filters: [throttle_average: 3s]
    ac_output_apparent_power:
      name: "AC Output Apparent Power"
      internal: true
    ac_output_active_power:
      id: s_load_power
      name: "AC Output Active Power"
      filters: [delta: 2]
    output_load_percent:
      name: "Output Load Percent"
      internal: true
    bus_voltage:
      name: "Bus Voltage"
      internal: true
      filters: [throttle_average: 3s]
    battery_voltage:
      id: s_batt_v
      name: "Battery Voltage"
      filters:
        - throttle_average: 2s
        - delta: 0.5
      on_raw_value:   # every inverter reply, before filters (NaN = no/garbled reply)
        - lambda: 'if (!isnan(x)) id(autopilot).mark_data();'
    battery_charging_current:
      id: s_batt_chg_a
      name: "Battery Charging Current"
      internal: true
      filters: [throttle_average: 1s]
    battery_discharge_current:
      id: s_batt_dis_a
      name: "Battery Discharge Current"
      internal: true
      filters: [throttle_average: 1s]
    battery_capacity_percent:
      id: s_soc
      name: "Battery Capacity Percent"
      filters: [throttle_average: 5s]
    inverter_heat_sink_temperature:
      id: s_heatsink
      name: "Inverter Heat Sink Temperature"
      filters: [throttle_average: 5s]
    pv_input_voltage:
      name: "PV Input Voltage"
      internal: true
      filters: [throttle_average: 3s]
    pv_input_current_for_battery:
      name: "PV Input Current For Battery"
      internal: true
      filters: [throttle_average: 10s]
    pv_charging_power:
      id: s_pv_power
      name: "PV Charging Power"
      filters:
        - throttle_average: 5s
        - delta: 1

  - platform: template
    id: batt_charge_power
    name: "Battery Charge Power"
    internal: true
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (isnan(id(s_batt_v).state) || isnan(id(s_batt_chg_a).state)) return {};
      return id(s_batt_v).state * id(s_batt_chg_a).state;
  - platform: template
    id: batt_discharge_power
    name: "Battery Discharge Power"
    internal: true
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (isnan(id(s_batt_v).state) || isnan(id(s_batt_dis_a).state)) return {};
      return id(s_batt_v).state * id(s_batt_dis_a).state;
  - platform: template
    id: batt_power
    name: "Battery Power"
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (isnan(id(batt_discharge_power).state) || isnan(id(batt_charge_power).state)) return {};
      return id(batt_discharge_power).state - id(batt_charge_power).state;
  - platform: template
    id: grid_power
    name: "Grid Power (estimated)"
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (isnan(id(s_grid_v).state) || id(s_grid_v).state < 100) return 0.0f;
      float load = isnan(id(s_load_power).state) ? 0 : id(s_load_power).state;
      float pv   = isnan(id(s_pv_power).state)   ? 0 : id(s_pv_power).state;
      float chg  = isnan(id(batt_charge_power).state)    ? 0 : id(batt_charge_power).state;
      float dis  = isnan(id(batt_discharge_power).state) ? 0 : id(batt_discharge_power).state;
      float g = load + chg - pv - dis;
      return g > 110 ? g : 0.0f;

  - platform: integration
    name: "Solar Energy"
    sensor: s_pv_power
    time_unit: h
    restore: true
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters: [multiply: 0.001]
  - platform: integration
    name: "Battery Charge Energy"
    sensor: batt_charge_power
    time_unit: h
    restore: true
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters: [multiply: 0.001]
  - platform: integration
    name: "Battery Discharge Energy"
    sensor: batt_discharge_power
    time_unit: h
    restore: true
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters: [multiply: 0.001]
  - platform: integration
    name: "Grid Import Energy"
    sensor: grid_power
    time_unit: h
    restore: true
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters: [multiply: 0.001]
  - platform: integration
    name: "Load Energy"
    sensor: s_load_power
    time_unit: h
    restore: true
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters: [multiply: 0.001]
  # ---- controller plan (exposed to Home Assistant): published by the component every minute
  - platform: solar_autopilot
    reserve_switch: { name: "Reserve Switch SOC" }
    reserve_return: { name: "Reserve Return SOC" }
    forecast_used: { name: "Solar Forecast Used" }
    soc_at_sun: { name: "Predicted SOC At Sun" }
    base_load: { name: "Base Load" }
    battery_remaining: { name: "Battery Remaining" }
    battery_runtime: { name: "Battery Runtime" }     # at the base load
    forecast_today: { name: "Solar Forecast Today" }
    forecast_tomorrow: { name: "Solar Forecast Tomorrow" }
  - platform: total_daily_energy
    id: e_load_today
    name: "Load Energy Today"
    internal: true
    power_id: s_load_power
    time_id: sntp_time
    restore: true
    unit_of_measurement: kWh
    accuracy_decimals: 2
    filters: [multiply: 0.001]
  - platform: total_daily_energy
    id: e_grid_today
    name: "Grid Import Energy Today"
    internal: true
    power_id: grid_power
    time_id: sntp_time
    restore: true
    unit_of_measurement: kWh
    accuracy_decimals: 2
    filters: [multiply: 0.001]
  - platform: total_daily_energy
    id: e_chg_today
    name: "Battery Charge Energy Today"
    internal: true
    power_id: batt_charge_power
    time_id: sntp_time
    restore: true
    unit_of_measurement: kWh
    accuracy_decimals: 2
    filters: [multiply: 0.001]
  - platform: total_daily_energy
    id: e_dis_today
    name: "Battery Discharge Energy Today"
    internal: true
    power_id: batt_discharge_power
    time_id: sntp_time
    restore: true
    unit_of_measurement: kWh
    accuracy_decimals: 2
    filters: [multiply: 0.001]
  # rolling 1 h average of the load (sample every 15 s, 240 samples), for the runtime estimate
  - platform: template
    id: s_load_1h
    name: "Load 1h Average"
    internal: true
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      if (!id(inv_link).state || isnan(id(s_load_power).state)) return {};
      return id(s_load_power).state;
    filters:
      - sliding_window_moving_average: { window_size: 240, send_every: 4, send_first_at: 1 }
  - platform: total_daily_energy
    id: e_solar_today
    name: "Solar Energy Today"
    internal: true
    power_id: s_pv_power
    time_id: sntp_time
    restore: true
    unit_of_measurement: kWh
    accuracy_decimals: 2
    filters: [multiply: 0.001]

  # On-board light sensor (LDR on GPIO34, ADC1). Raw volts: higher = darker.
  # Only measured for now; auto-dim the backlight once real readings are known.
  - platform: adc
    id: s_ldr
    name: "Ambient Light (raw)"
    internal: true
    pin: GPIO34
    attenuation: 0db
    update_interval: 1s
    entity_category: diagnostic
    accuracy_decimals: 3
    filters:
      - median: { window_size: 5, send_every: 2 }

  # Backlight level wanted right now (0-1). Auto off -> 100 %.
  # Linear between the two calibration readings, so it works whichever way the LDR goes.
  - platform: template
    id: bl_target
    internal: true
    update_interval: 2s
    lambda: |-
      if (!id(sw_autobl).state) return 1.0f;
      float v = id(s_ldr).state, d = id(n_ldr_dark).state, b = id(n_ldr_bright).state;
      if (isnan(v) || fabsf(d - b) < 0.005f) return 1.0f;
      float dark = clamp((v - b) / (d - b), 0.0f, 1.0f);    // 0 = bright room, 1 = dark room
      float lo = id(n_bl_min).state / 100.0f;
      return 1.0f - dark * (1.0f - lo);

  - platform: wifi_signal
    id: s_rssi
    name: "ESP WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "ESP Uptime"
    update_interval: 60s
  - platform: template
    name: "Inverter Data Age"
    internal: true
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: 'return (millis() - id(autopilot).last_data_ms()) / 1000.0;'


binary_sensor:
  # Controller flags. "Inverter Link" = fresh inverter data (reply < 30 s, SOC and load known):
  # pipsolar sensors keep their last value when the link drops, so the screen and HA go by this.
  - platform: solar_autopilot
    link: { id: inv_link, name: "Inverter Link" }
    cloudy: { name: "Cloudy Day Plan" }
    charging: { name: "Grid Charging Active" }
    fault: { name: "Controller Fault" }
  # BOOT button (GPIO0, only a strapping pin at reset): each press = next touch orientation
  - platform: gpio
    id: btn_boot
    internal: true
    pin: { number: GPIO0, inverted: true, mode: { input: true, pullup: true }, ignore_strapping_warning: true }
    filters: [delayed_on: 30ms]
    on_press:
      - lambda: |-
          uint8_t o = (id(touch_orient) + 1) & 7;
          id(touch_orient) = o;
          id(touch).set_swap_xy(o & 4);
          id(touch).set_mirror_x(o & 2);
          id(touch).set_mirror_y(o & 1);
          ESP_LOGW("touch", "orientation %u: swap=%d mx=%d my=%d", o, !!(o & 4), !!(o & 2), !!(o & 1));
      - script.execute:
          id: toast
          msg: !lambda |-
            uint8_t o = id(touch_orient);
            return str_sprintf("Touch %u/8: swap %s, mirror X %s, Y %s", o + 1,
                               (o & 4) ? "on" : "off", (o & 2) ? "on" : "off", (o & 1) ? "on" : "off");
      - script.execute: bl_wake

  - platform: pipsolar
    pipsolar_id: my_inverter
    load_status:
      name: "Load On"
      internal: true
    charging_status:
      name: "Charging"
      internal: true
    scc_charging_status:
      name: "Solar Charging"
      internal: true
    ac_charging_status:
      name: "AC Charging"
      internal: true
    charging_to_floating_mode:
      id: bs_floating
      name: "Floating Mode"
      internal: true
      # entering float -> "Float Voltage Target" (solar_autopilot)
    warnings_present:
      name: "Warnings Present"
    faults_present:
      name: "Faults Present"
    warning_line_fail:
      name: "Warning Grid Lost"
      internal: true
    warning_battery_low_alarm:
      name: "Warning Battery Low"
      internal: true
    warning_battery_under_shutdown:
      name: "Warning Battery Under Shutdown"
      internal: true
    warning_over_load:
      name: "Warning Overload"
      internal: true
    warning_over_temperature:
      name: "Warning Over Temperature"
      internal: true
    warning_fan_lock:
      name: "Warning Fan Lock"
      internal: true
  - platform: template
    id: bs_grid
    name: "Grid Available"
    device_class: power
    lambda: 'return !isnan(id(s_grid_v).state) && id(s_grid_v).state > 150;'
    filters:
      - delayed_on: 30s
      - delayed_off: 30s
  - platform: status
    name: "ESP Status"

text_sensor:
  - platform: solar_autopilot
    state: { name: "Controller State" }
    forecast_status: { name: "Forecast Status" }
  - platform: pipsolar
    pipsolar_id: my_inverter
    device_mode:
      name: "Device Mode"
      filters:
        - map:
            - P -> Power On
            - S -> Standby
            - L -> Line (Grid)
            - B -> Battery
            - F -> Fault
            - H -> Power Saving
            - D -> Shutdown
    last_qpiws:
      name: "Warning Bits (QPIWS)"
  - platform: version
    name: "ESPHome Version"
  - platform: wifi_info
    ssid:
      id: t_ssid
      name: "ESP WiFi SSID"
    ip_address:
      id: t_ip
      name: "ESP IP Address"

button:
  - platform: template
    name: "LED Test"
    icon: mdi:led-on
    entity_category: config
    on_press:
      - script.execute: led_selftest
  - platform: template
    name: "Buzzer Test"
    entity_category: config
    on_press:
      - script.execute: { id: play_tune, tune: "test", prio: 1, critical: true }
  - platform: restart
    name: "ESP Restart"
  - platform: safe_mode
    name: "ESP Safe Mode Boot"

# -----------------------------------------------------------------------------
# SELECTS (unchanged from inverter-esphome.yaml)
# -----------------------------------------------------------------------------
select:
  - platform: template
    name: "Output Source Priority"
    id: sel_output_source_priority
    update_interval: 3s
    options:
      - "Utility first (USB)"
      - "Solar first (SUB)"
      - "Battery first (SBU)"
    lambda: |-
      float v = id(s_output_source_priority).state;
      if (isnan(v)) return {};
      switch ((int) v) {
        case 0: return std::string("Utility first (USB)");
        case 1: return std::string("Solar first (SUB)");
        case 2: return std::string("Battery first (SBU)");
      }
      return {};
    set_action:
      - output.pipsolar.set_level:
          id: out_output_source_priority
          value: !lambda |-
            if (x == "Utility first (USB)") return 0.0f;
            if (x == "Solar first (SUB)") return 1.0f;
            return 2.0f;

  - platform: template
    name: "Charger Source Priority"
    id: sel_charger_source_priority
    update_interval: 3s
    options:
      - "Utility first"
      - "Solar first"
      - "Solar and utility"
      - "Solar only"
    lambda: |-
      float v = id(s_charger_source_priority).state;
      if (isnan(v)) return {};
      switch ((int) v) {
        case 0: return std::string("Utility first");
        case 1: return std::string("Solar first");
        case 2: return std::string("Solar and utility");
        case 3: return std::string("Solar only");
      }
      return {};
    set_action:
      - output.pipsolar.set_level:
          id: out_charger_source_priority
          value: !lambda |-
            if (x == "Utility first") return 0.0f;
            if (x == "Solar first") return 1.0f;
            if (x == "Solar and utility") return 2.0f;
            return 3.0f;

  - platform: template
    name: "Set Max AC Charging Current"
    id: sel_max_ac_charging_current
    update_interval: 3s
    options: ["2", "10", "20", "30", "40", "50", "60"]
    lambda: |-
      float v = id(s_max_ac_charging_current).state;
      if (isnan(v)) return {};
      char buf[8]; snprintf(buf, sizeof(buf), "%.0f", v);
      return std::string(buf);
    set_action:
      - output.pipsolar.set_level:
          id: out_max_ac_charging_current
          value: !lambda return atof(x.c_str());

  - platform: template
    name: "Set Battery Recharge Voltage"
    internal: true
    id: sel_battery_recharge_voltage
    update_interval: 3s
    options: ["22.0", "22.5", "23.0", "23.5", "24.0", "24.5", "25.0", "25.5"]
    lambda: |-
      float v = id(s_battery_recharge_voltage).state;
      if (isnan(v)) return {};
      char buf[8]; snprintf(buf, sizeof(buf), "%.1f", v);
      return std::string(buf);
    set_action:
      - output.pipsolar.set_level:
          id: out_battery_recharge_voltage
          value: !lambda return atof(x.c_str());

  - platform: template
    name: "Set Battery Re-discharge Voltage"
    internal: true
    id: sel_battery_redischarge_voltage
    update_interval: 3s
    options: ["24.0", "24.5", "25.0", "25.5", "26.0", "26.5", "27.0", "27.5", "28.0", "28.5", "29.0"]
    lambda: |-
      float v = id(s_battery_redischarge_voltage).state;
      if (isnan(v)) return {};
      char buf[8]; snprintf(buf, sizeof(buf), "%.1f", v);
      return std::string(buf);
    set_action:
      - output.pipsolar.set_level:
          id: out_battery_redischarge_voltage
          value: !lambda return atof(x.c_str());

  - platform: template
    name: "Set Battery Under Voltage"
    internal: true
    id: sel_battery_under_voltage
    update_interval: 3s
