# =============================================================================
# HIL (hardware in the loop) build of inverter-cyd.yaml: the SAME firmware, with the inverter
# link moved to the board's USB serial port, so a PC can play the inverter (tools/hil/).
#
# Only I/O is changed - controller, screen, sounds, web server, forecast fetch are identical:
#   - uart: GPIO1/GPIO3 (the CH340 USB-serial chip) instead of CN1 GPIO22/27 + MAX3232
#   - logger: off on the serial port (it now carries PI30); read the log on the web page
#   - time: the PC sets it through the "HIL Clock" text (epoch seconds); NTP only at boot
#   - forecast: the PC sets "HIL Forecast Today / Tomorrow" (kWh); the real fetch still runs
#   - name inverter-cyd-hil: its own build folder, does not overwrite the production build
#
# NEVER connect this build to the real inverter: CN1 is unused and the USB port is the link.
# =============================================================================

substitutions:
  name: inverter-cyd-hil

packages:
  main: !include inverter-cyd.yaml

logger:
  baud_rate: 0                   # UART0 = the inverter link now

uart:
  id: uart_inverter
  tx_pin: GPIO1                  # USB-serial chip RX
  rx_pin: GPIO3                  # USB-serial chip TX

time:
  - id: !extend sntp_time
    update_interval: 24h         # first sync at boot only; then the PC's HIL Clock rules

text:
  - platform: template
    name: "HIL Clock"
    mode: text
    optimistic: true
    set_action:
      - lambda: |-
          const uint32_t e = strtoul(x.c_str(), nullptr, 10);
          if (e > 1600000000UL) {
            struct timeval tv = {(time_t) e, 0};
            settimeofday(&tv, nullptr);          // what SNTP does; ESPHome's clock reads system time
            ESP_LOGW("hil", "clock set to %u", (unsigned) e);
          }

number:
  - platform: template
    id: hil_fc_today
    name: "HIL Forecast Today"
    min_value: -1
    max_value: 50
    step: 0.1
    initial_value: -1            # -1 = unknown
    optimistic: true
    mode: box
  - platform: template
    id: hil_fc_tomorrow
    name: "HIL Forecast Tomorrow"
    min_value: -1
    max_value: 50
    step: 0.1
    initial_value: -1
    optimistic: true
    mode: box

solar_autopilot:
  forecast_today: !lambda 'return id(hil_fc_today).state < 0 ? NAN : id(hil_fc_today).state;'
  forecast_tomorrow: !lambda 'return id(hil_fc_tomorrow).state < 0 ? NAN : id(hil_fc_tomorrow).state;'
